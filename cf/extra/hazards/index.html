<title>GOV RADAR 재난 한눈에 보기</title>
<style>
@font-face{font-family:"WMM Nexon";font-weight:300;font-display:swap;src:local("NEXON Lv1 Gothic OTF Light"),url("/assets/fonts/NEXONLv1GothicOTFLight.woff") format("woff")}
@font-face{font-family:"WMM Nexon";font-weight:400;font-display:swap;src:local("NEXON Lv1 Gothic OTF"),url("/assets/fonts/NEXONLv1GothicOTF.woff") format("woff")}
@font-face{font-family:"WMM Nexon";font-weight:700;font-display:swap;src:local("NEXON Lv1 Gothic OTF Bold"),url("/assets/fonts/NEXONLv1GothicOTFBold.woff") format("woff")}
:root{--bg:#F5F5F2;--panel:#fff;--panel2:#EDEDEA;--ink:#0B0B0B;--muted:#5C5C5A;--line:#D7D7D3;--sea:#E7EEEC;--land:#D3D9D7;--edge:#fff;
--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
--f:"WMM Nexon","NEXON Lv1 Gothic OTF","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
--emo:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0A0A0A;--panel:#141414;--panel2:#1C1C1C;--ink:#F2F2EF;--muted:#A3A39F;--line:#2B2B2A;--sea:#101615;--land:#2C3432;--edge:#0A0A0A;
--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,table{font-family:var(--f)}
a{color:inherit}
.in{max-width:1200px;margin:0 auto;padding:0 24px}
@media (max-width:640px){.in{padding:0 16px}body{font-size:16px}}
header.top{background:#0A0A0A;color:#F2F2EF}

header.top img{height:36px;width:auto;display:block}

.lang{background:#F2F2EF;color:#0A0A0A;border:0;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer}

.hero{padding:72px 0 40px}

h3{font-size:20px;font-weight:700;margin:0 0 8px}
.lede{font-size:clamp(17px,2vw,21px);max-width:38em;margin:0}
.sub{color:var(--muted);font-weight:300;font-size:15px;max-width:52em;margin:0}
section{padding:60px 0}
section.alt{background:var(--panel)}
@media (min-width:900px){section{padding:96px 0}.hero{padding:104px 0 56px}}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;margin-top:48px}
.kp b{display:block;font-size:clamp(26px,3.6vw,46px);line-height:1.1;font-weight:700;white-space:nowrap}
.kp span{display:block;color:var(--muted);font-size:15px;margin-top:6px}
.kp .e{font-family:var(--emo);font-size:.8em}
@media (max-width:760px){.kp{grid-template-columns:1fr 1fr;gap:24px}}
.e{font-family:var(--emo);font-style:normal}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 16px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);color:var(--ink);border:0;border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer;line-height:1.2}
section.alt .chip{background:var(--bg)}
.chip i{width:12px;height:12px;border-radius:3px;display:inline-block}

.chip.on,.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg{display:inline-flex;background:var(--panel2);border-radius:999px;padding:4px;gap:2px}
section.alt .seg{background:var(--bg)}
.seg button{border:0;background:transparent;color:var(--ink);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:700;cursor:pointer}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--f);fill:var(--muted);font-size:12px}
svg text.e{font-family:var(--emo);fill:var(--ink)}
svg text.k{fill:var(--ink);font-weight:700}
.wide{min-width:820px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.hm{border-collapse:separate;border-spacing:2px;font-size:13px;min-width:980px;width:100%;margin-top:28px}
table.hm th{font-weight:400;color:var(--muted);text-align:center;padding:4px 0;white-space:nowrap}
table.hm th.r{text-align:left;color:var(--ink);font-weight:700;font-size:15px;padding-right:12px;position:sticky;left:0;background:var(--bg);z-index:1}
section.alt table.hm th.r{background:var(--panel)}
table.hm td{text-align:center;padding:7px 0;border-radius:4px;min-width:30px;font-variant-numeric:tabular-nums}
table.hm tr.tot td{font-weight:700}
.mapwrap{background:var(--sea);border-radius:14px;overflow:hidden;position:relative}
.mapwrap svg{overflow:hidden}
.cty{stroke:var(--edge);stroke-width:.5;cursor:pointer;transition:opacity .15s}
.cty:hover{opacity:.72}
.mk{cursor:pointer}
.lg{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;color:var(--muted);font-size:14px;margin-top:14px}
.lg span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.lg i{width:22px;height:12px;border-radius:3px;display:inline-block}
.cv{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;margin-top:40px;align-items:start}
@media (max-width:860px){.cv{grid-template-columns:1fr;gap:24px}}
.cv h3{font-size:clamp(26px,3.4vw,38px);margin-bottom:4px}
.big{font-size:clamp(30px,4vw,46px);font-weight:700;line-height:1.1;margin:14px 0 2px}
.bars{margin:22px 0 0;padding:0;list-style:none}
.bars li{display:grid;grid-template-columns:150px 1fr 76px;gap:10px;align-items:center;padding:5px 0;font-size:15px}
.bars .t{white-space:nowrap}.bars .v{text-align:right;padding-right:4px;font-variant-numeric:tabular-nums}
.bars .b{height:12px;border-radius:0 4px 4px 0;min-width:2px}
@media (max-width:480px){.bars li{grid-template-columns:118px 1fr 64px}}
.evl{list-style:none;margin:10px 0 0;padding:0;font-size:15px}
.evl li{padding:6px 0;display:flex;gap:10px}
.evl small{color:var(--muted);font-weight:300;display:block}
.back{margin-top:22px;border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-weight:700;font-size:15px;cursor:pointer}
.sel{border:0;background:var(--panel2);color:var(--ink);border-radius:999px;padding:9px 14px;font-size:15px;max-width:220px}
section.alt .sel{background:var(--bg)}
.apk{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 32px;margin-top:40px}
@media (max-width:860px){.apk{grid-template-columns:1fr 1fr}}
.apk b{display:block;font-size:clamp(24px,3vw,34px);line-height:1.15}
.apk span{display:block;font-size:15px}
.apk small{display:block;color:var(--muted);font-weight:300;font-size:14px}
.fact{background:var(--ink);color:var(--bg);border-radius:14px;padding:28px 32px;margin-top:36px;font-size:clamp(17px,2vw,21px);max-width:52em}
.fact b{font-weight:700}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.5;max-width:280px;z-index:9;opacity:0;transition:opacity .1s}
#tip b{font-size:14px}#tip .e{margin-right:4px}
.src{color:var(--muted);font-weight:300;font-size:14px;margin-top:20px;max-width:60em}
footer{background:#0A0A0A;color:#F2F2EF;padding:64px 0}
footer .n{font-size:clamp(26px,4vw,44px);font-weight:700;line-height:1.15;margin:0 0 12px}
footer p{margin:4px 0;font-weight:300;font-size:15px;color:#BDBDB8}
footer img{width:56px;height:56px;border-radius:50%;background:#fff;margin-bottom:20px}
/* ---- animated hazard clips ---- */
.lg .chip{padding:5px 11px;font-size:13px}.lg .chip[aria-pressed=false]{opacity:.5}
.fkbox{display:grid;grid-template-columns:minmax(240px,360px) 1fr;gap:10px 28px;align-items:start;margin-top:22px}
.fkbox .hzc{grid-row:span 2}.fkbox .back{justify-self:start;margin-top:0}
@media (max-width:640px){.fkbox{grid-template-columns:1fr}.fkbox .hzc{grid-row:auto}}

.hzg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:28px}
.hzc{margin:0;display:flex;flex-direction:column;gap:10px}
.hzc-v{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:radial-gradient(120% 90% at 50% 50%,#14202a 0%,#0a0f14 60%,#06090c 100%);isolation:isolate}
.hzc-bg{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.hzc-bg.space{background:radial-gradient(120% 100% at 80% 80%,#0d1730 0%,#04060d 70%)}
.hzbg-land{fill:#303945;stroke:#0b0e12;stroke-width:.5}
.hzbg-hl{fill:#743226;stroke:#ff8b6b;stroke-width:1}
.hzc-sw{position:absolute;z-index:2;left:50%;top:50%;width:260%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;background:conic-gradient(from 0deg,rgba(80,255,190,0) 0deg,rgba(80,255,190,0) 300deg,rgba(80,255,190,.34) 350deg,rgba(170,255,225,.8) 360deg);-webkit-mask:radial-gradient(circle,#000 0 40%,transparent 41%);mask:radial-gradient(circle,#000 0 40%,transparent 41%);animation:hzspin 4.2s linear infinite;mix-blend-mode:screen}
.hzc-rg{position:absolute;z-index:2;inset:0;pointer-events:none;background:repeating-radial-gradient(circle at 50% 50%,transparent 0 38px,rgba(120,255,200,.16) 39px 40px)}
.hzc-v::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(transparent 49.6%,rgba(120,255,200,.10) 50%,transparent 50.4%),linear-gradient(90deg,transparent 49.6%,rgba(120,255,200,.10) 50%,transparent 50.4%)}
@keyframes hzspin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.hzfx{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.hzfx svg{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.hzc-tag{position:absolute;z-index:5;left:10px;top:10px;font:700 13px/1.2 var(--f);color:#fff;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 10px}
.hzc-now{position:absolute;z-index:5;right:10px;top:10px;font:700 12px/1.2 var(--f);color:#fff;background:#c62828;border-radius:999px;padding:4px 9px;animation:hznow 1.6s ease-in-out infinite}
@keyframes hznow{50%{opacity:.55}}
.hzc figcaption{font-size:15px;line-height:1.5;display:flex;flex-direction:column;gap:2px}
.hzc figcaption b{font-weight:700}
.hzc figcaption span{color:var(--muted);font-weight:300;font-size:14px}
.hzc figcaption .nw{color:#c62828;font-weight:400}
@media (prefers-color-scheme:dark){.hzc figcaption .nw{color:#ff8a80}}
.hzc-wrap{}#chz{margin-top:8px}.hzsub{margin:44px 0 0;font-size:20px;font-weight:700}
.hzsub+.sub{margin-top:4px}
@media (max-width:600px){.hzg{grid-template-columns:1fr 1fr;gap:12px}.hzc-tag{font-size:11px;padding:3px 7px;left:6px;top:6px}.hzc-now{font-size:10px;right:6px;top:6px}.hzc figcaption{font-size:13px}.hzc figcaption span{font-size:12px}}
@media (max-width:380px){.hzg{grid-template-columns:1fr}}
/* flood */
.fl-rise{animation:flrise 5s ease-in-out infinite}
.fl-w1{fill:rgba(60,150,255,.55);animation:flx 3s linear infinite}.fl-w2{fill:rgba(30,110,230,.6);animation:flx 2.2s linear infinite reverse}
@keyframes flx{to{transform:translateX(80px)}}@keyframes flrise{0%,100%{transform:translateY(18px)}50%{transform:translateY(-8px)}}
.rain line{stroke:rgba(170,210,255,.75);stroke-width:1.2;animation:rain .7s linear infinite}
@keyframes rain{from{transform:translate(0,-10px)}to{transform:translate(-14px,110px)}}
/* storm */
.ty-spin{transform-origin:0 0;animation:tyspin 2.4s linear infinite}
.ty-spin path{fill:rgba(235,245,255,.82);stroke:none}.ty-spin .ty-arm{fill:none;stroke:rgba(235,245,255,.55);stroke-width:5;stroke-linecap:round}
.ty-eye{fill:#0a0f14;stroke:rgba(255,255,255,.7);stroke-width:1}
@keyframes tyspin{to{transform:rotate(-360deg)}}
.wind path{fill:none;stroke:rgba(200,230,255,.45);stroke-width:1.4;stroke-linecap:round;stroke-dasharray:24 140;animation:wind 1.8s linear infinite}
@keyframes wind{from{stroke-dashoffset:160}to{stroke-dashoffset:0}}
/* tsunami */
.ts-move{animation:tsmove 4s cubic-bezier(.4,0,.6,1) infinite}
.ts-body{fill:rgba(40,130,230,.78)}.ts-foam{fill:none;stroke:#eaf6ff;stroke-width:3;stroke-linecap:round}
.ts-shore{fill:#5b4a3a}
@keyframes tsmove{0%{transform:translateX(-40px) scaleY(.6);opacity:0}15%{opacity:1}70%{transform:translateX(150px) scaleY(1.15);opacity:1}100%{transform:translateX(190px) scaleY(1);opacity:0}}
/* earthquake */
.hz-quake .hzc-bg{animation:qkshake .5s steps(2) infinite}
.qk-line{fill:none;stroke:#ffb347;stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-dasharray:300;animation:qkdraw 2.2s linear infinite}
@keyframes qkdraw{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
@keyframes qkshake{0%{transform:translate(1.5px,-1px)}50%{transform:translate(-1.5px,1px)}100%{transform:translate(1px,1.5px)}}
.qk-r{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border:2px solid rgba(255,120,70,.9);border-radius:50%;animation:qkring 2.4s ease-out infinite}
.qk-r.r2{animation-delay:.8s}.qk-r.r3{animation-delay:1.6s}
@keyframes qkring{from{transform:scale(.3);opacity:1}to{transform:scale(6);opacity:0}}
/* landslide */
.ls-hill{fill:#4a3b2e}.ls-scar{fill:none;stroke:#8a6a4a;stroke-width:3;stroke-linecap:round;stroke-dasharray:4 3}
.ls-rock polygon{fill:#b08a62;stroke:#2a1e14;stroke-width:.6}
.ls-rock{animation:lsroll 2.7s cubic-bezier(.5,0,.9,.6) infinite;opacity:0}
@keyframes lsroll{0%{transform:translate(14px,20px) rotate(0);opacity:0}8%{opacity:1}50%{transform:translate(78px,48px) rotate(360deg)}90%{opacity:1}100%{transform:translate(140px,84px) rotate(760deg);opacity:0}}
.ls-dust{fill:rgba(190,160,120,.4);transform-box:fill-box;transform-origin:center;animation:lsdust 2.7s ease-out infinite;opacity:0}
@keyframes lsdust{0%{transform:scale(.3);opacity:0}30%{opacity:.8}100%{transform:scale(1.8) translateY(-6px);opacity:0}}
/* wildfire + flames */
.tree{fill:#1f3a24}
.fi-f{fill:rgba(255,120,30,.9);transform-box:fill-box;transform-origin:50% 100%;animation:fiflick .6s ease-in-out infinite alternate}
.fi-f:nth-child(2n){fill:rgba(255,200,60,.9)}
@keyframes fiflick{from{transform:scaleY(.8) skewX(-4deg)}to{transform:scaleY(1.18) skewX(5deg)}}
.fi-e{fill:#ffcc66;animation:fiember 2.4s linear infinite}
@keyframes fiember{from{transform:translateY(0);opacity:1}to{transform:translateY(-60px) translateX(8px);opacity:0}}
/* urban fire */
.bld rect{fill:#1b222b;stroke:#3a4552;stroke-width:.6}
.win rect{fill:#ffb347;animation:winf 1.1s ease-in-out infinite alternate}
@keyframes winf{from{fill:#ffcf5a;opacity:1}to{fill:#ff6a28;opacity:.55}}
.sm circle{fill:rgba(160,160,165,.5);transform-box:fill-box;transform-origin:center;animation:smoke 3.2s ease-out infinite;opacity:0}
@keyframes smoke{0%{transform:translateY(0) scale(.5);opacity:0}25%{opacity:.75}100%{transform:translate(14px,-46px) scale(1.9);opacity:0}}
.truck{animation:truck 6s linear infinite}.truck rect{fill:#d6332b}.truck circle{fill:#111}.truck .siren{fill:#4da3ff;animation:siren .4s steps(2) infinite}
@keyframes truck{0%{transform:translateX(0)}60%,100%{transform:translateX(70px)}}
@keyframes siren{50%{fill:#ff3b30}}
/* drought / heat */
.sun{fill:#ffb020;animation:sunp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 0 6px rgba(255,170,40,.8))}
@keyframes sunp{50%{transform:scale(1.12)}}
.sun-r{animation:spinr 9s linear infinite}.sun-r line{stroke:#ffc040;stroke-width:2;stroke-linecap:round}
@keyframes spinr{to{transform:rotate(360deg)}}
.dr-ground{fill:#7a5a36}
.crack path{fill:none;stroke:#2a1a0c;stroke-width:1.6;stroke-linejoin:round;stroke-dasharray:90;animation:crack 3.6s ease-in-out infinite}
@keyframes crack{0%{stroke-dashoffset:90}60%,100%{stroke-dashoffset:0}}
.shim path{fill:none;stroke:rgba(255,220,160,.55);stroke-width:1.2;animation:shim 2.2s ease-in infinite;opacity:0}
@keyframes shim{0%{transform:translateY(0);opacity:0}30%{opacity:.9}100%{transform:translateY(-18px);opacity:0}}
.dr-plant{fill:none;stroke:#9a8a4a;stroke-width:1.4;stroke-linecap:round}
.th-tube{fill:rgba(255,255,255,.15);stroke:rgba(255,255,255,.7);stroke-width:1}.th-bulb{fill:#e0332b}
.th-lv{fill:#e0332b;transform-box:fill-box;transform-origin:50% 100%;animation:thlv 4s ease-in-out infinite}
@keyframes thlv{0%,100%{transform:scaleY(.2);fill:#4da3ff}50%{transform:scaleY(1);fill:#e0332b}}
.fl{animation:snow 3.2s linear infinite;opacity:0}.fl path{stroke:#e6f3ff;stroke-width:1;stroke-linecap:round}
@keyframes snow{0%{transform:translate(0,-6px);opacity:0}10%{opacity:1}100%{transform:translate(-8px,104px);opacity:.4}}
/* volcano */
.vo-m{fill:#3d2b22;stroke:#1b120d}.vo-lava{fill:#ff5a1f;animation:volava 1.2s ease-in-out infinite alternate}
@keyframes volava{from{opacity:.7}to{opacity:1;filter:drop-shadow(0 0 4px #ff7a2f)}}
.vo-p{fill:#ff8c2a;animation:vobomb 1.6s ease-out infinite}
@keyframes vobomb{0%{transform:translate(0,0);opacity:1}60%{transform:translate(var(--dx),-38px)}100%{transform:translate(calc(var(--dx)*1.5),-10px);opacity:0}}
.vo-smoke{fill:rgba(200,200,200,.45);transform-box:fill-box;transform-origin:30% 100%;animation:vosmoke 3.5s ease-in-out infinite}
@keyframes vosmoke{0%{transform:scale(.6) translateY(10px);opacity:0}40%{opacity:.8}100%{transform:scale(1.3) translateY(-14px);opacity:0}}
/* comet / meteor impact */
.st{fill:#fff;animation:twinkle 2.4s ease-in-out infinite}@keyframes twinkle{50%{opacity:.25}}
.co-move{animation:comove 4.5s linear infinite}
.co-head{fill:#fff;filter:drop-shadow(0 0 5px #9fd0ff)}.co-tail{fill:rgba(160,210,255,.55)}
@keyframes comove{0%{transform:translate(-20px,-10px);opacity:1}80%{transform:translate(118px,64px);opacity:1}82%,100%{transform:translate(120px,66px);opacity:0}}
.earth{fill:#2a6fd6;stroke:#9fd0ff;stroke-width:1.2;filter:drop-shadow(0 0 6px rgba(80,160,255,.7))}
.im-flash{fill:#fff3c0;transform-box:fill-box;transform-origin:center;animation:imf 4.5s linear infinite;opacity:0}
@keyframes imf{0%,80%{transform:scale(.2);opacity:0}84%{opacity:1;transform:scale(2.4)}100%{transform:scale(4);opacity:0}}
/* war */
.msl path{fill:none;stroke:#ffd07a;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:14 200;animation:msl 3.3s linear infinite;opacity:0}
@keyframes msl{0%{stroke-dashoffset:150;opacity:1}30%{stroke-dashoffset:0;opacity:1}31%,100%{opacity:0}}
.boom{transform-box:fill-box;transform-origin:center;animation:boom 3.3s ease-out infinite;opacity:0}
.boom circle{fill:rgba(255,120,40,.85)}.boom .b2{fill:#fff1b0}
@keyframes boom{0%,4%{transform:scale(.2);opacity:0}8%{opacity:1;transform:scale(1)}30%{transform:scale(2.4);opacity:0}100%{opacity:0}}
.xh{animation:xh 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.xh circle,.xh line{fill:none;stroke:#ff4d3a;stroke-width:1.4}
@keyframes xh{50%{transform:scale(.86)}}

.pp circle,.pp path,.pr circle,.pr path{fill:#dfe6ee}

var tip=document.getElementById('tip');
function showTip(ev,html){tip.innerHTML=html;tip.style.opacity=1;var x=ev.clientX+14,y=ev.clientY+14,w=tip.offsetWidth,h=tip.offsetHeight;if(x+w>innerWidth-8)x=ev.clientX-w-14;if(y+h>innerHeight-8)y=ev.clientY-h-14;tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px'}

function bind(sel,html){sel.on('mousemove',function(ev,d){showTip(ev,html(d))}).on('mouseleave',hideTip).on('touchstart',function(ev,d){var t=ev.touches[0];showTip(t,html(d))},{passive:true})}

 var st=d3.stack().keys(act)(rows);
 var x=d3.scaleBand().domain(D.years).range([m.l,W-m.r]).padding(.22);
 var max=d3.max(rows,function(r){return d3.sum(act,function(t){return r[t]})});
 var y=d3.scaleLinear().domain([0,max]).nice(5).range([H-m.b,m.t]);
 svg.append('g').selectAll('line').data(y.ticks(5)).join('line').attr('x1',m.l).attr('x2',W-m.r).attr('y1',y).attr('y2',y).attr('stroke','var(--line)').attr('stroke-width',function(d){return d?0.7:1.2});
 svg.append('g').selectAll('text').data(y.ticks(5)).join('text').attr('x',m.l-8).attr('y',function(d){return y(d)+4}).attr('text-anchor','end').text(function(d){return d});
 svg.append('g').selectAll('text').data(D.years).join('text').attr('x',function(d){return x(d)+x.bandwidth()/2}).attr('y',H-8).attr('text-anchor','middle').text(function(d){return false?'':("'"+String(d).slice(2))});
 var g=svg.append('g');
 st.forEach(function(s){g.append('g').attr('fill',COL[s.key]).selectAll('rect').data(s).join('rect').attr('x',function(d){return x(d.data.y)}).attr('width',x.bandwidth())
  .attr('y',function(d){return y(d[1])+1}).attr('height',function(d){return Math.max(0,y(d[0])-y(d[1])-2)}).attr('rx',2)});
 var hit=svg.append('g').selectAll('rect').data(rows).join('rect').attr('x',function(d){return x(d.y)-x.step()*.11}).attr('width',x.step()).attr('y',m.t).attr('height',H-m.b-m.t).attr('fill','transparent');

 var mk=svg.append('g').selectAll('g').data(near).join('g').attr('class','mk').attr('transform',function(d){var p=pr([d.x,d.y]);return 'translate('+p[0]+','+p[1]+')'});
