<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>GOV RADAR 운영자 전체 화면</title>
<link rel="stylesheet" href="/assets/site.css">
<style>
body{background:var(--bg,#f7f7f5)}main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h1{font-weight:700;margin:4px 0}h2{font-weight:700;margin:28px 0 10px}.cap{font-weight:300;color:#666;font-size:13px}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.kp div{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px}
.kp b{display:block;font-size:26px;font-weight:700}.kp .bl b{color:#1a5fd0}.kp .rd b{color:#c62828}
table{width:100%;border-collapse:collapse;background:#fff;font-size:14px}th,td{border-bottom:1px solid #eee;padding:7px 6px;text-align:left;vertical-align:top}
th{font-weight:700;background:#f0f0ee;position:sticky;top:0}tr.new td:first-child{box-shadow:inset 4px 0 0 #1a5fd0}tr.hot td{color:#c62828}tr.hot td a{color:#c62828}
.nb{font-size:11px;font-weight:700;color:#fff;background:#1a5fd0;border-radius:4px;padding:1px 6px;margin-left:4px}
.tw{max-height:70vh;overflow:auto;border:1px solid #ddd;border-radius:10px}
.pc{background:#fff;border:1px dashed #bbb;border-radius:10px;padding:12px;margin:10px 0}.pc.m{border:1px solid #8a5a00}
.pc ul{margin:6px 0;padding-left:18px;font-size:13px}.ok{color:#1b7f3b}.ng{color:#c62828}
#gate{max-width:420px;margin:12vh auto;background:#fff;border:1px solid #ddd;border-radius:12px;padding:24px}
#gate input{width:100%;padding:10px;font-size:16px;margin:10px 0}#gate button,.btn2{padding:10px 16px;font-weight:700;border:0;border-radius:8px;background:#1d2b4f;color:#fff;cursor:pointer}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.links a{display:inline-block;margin:4px 10px 4px 0}
.fc-hero{background:#0a0a0a url(/assets/spot.jpg) center/cover;color:#f2f2ef;border-radius:16px;padding:36px 32px;margin:36px 0 10px}
.fc-hero h2{margin:6px 0 8px;font-size:clamp(28px,4vw,44px);color:#fff}.fc-eb{font-size:12.5px;color:#bdbdb8;margin:0}.fc-lede{color:#cfcfcb;max-width:46em;font-size:16px}
.fc-k{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px}.fc-k b{display:block;font-size:34px;color:#fff}.fc-k div{font-size:13px;color:#bdbdb8}
.fc-h{margin-top:40px}.fc-sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.fc-sc{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:#fff;border-radius:14px;overflow:hidden;padding-bottom:12px;box-shadow:0 1px 0 #e5e5e2}
.fc-sc b,.fc-sc .cap{padding:0 14px}.fc-im{position:relative;aspect-ratio:16/9;overflow:hidden;background:#1d2b4f}.fc-im img,.fc-im svg{width:100%;height:100%;object-fit:cover;display:block}
.fc-g{position:absolute;left:10px;top:10px;color:#fff;font-weight:700;font-size:13px;border-radius:6px;padding:2px 9px}
.fc-sim{display:grid;grid-template-columns:340px 1fr;gap:0;background:#fff;border-radius:16px;overflow:hidden;margin:16px 0}
.fc-sim-im{background:#1d2b4f;min-height:100%}.fc-sim-im img,.fc-sim-im svg{width:100%;height:100%;object-fit:cover;display:block}
.fc-sim-b{padding:22px 26px}.fc-sim-b h3{margin:4px 0 6px;font-size:24px}.fc-tag{margin:0;font-size:13px;color:#666}.fc-tag span{color:#fff;font-weight:700;border-radius:5px;padding:1px 8px;margin-right:6px}
.fc-pr{background:#f3f1ea;border-left:3px solid #111;padding:10px 14px;font-size:15px}
.fc-tl{list-style:none;padding:0;margin:14px 0;border-left:2px solid #ddd}.fc-tl li{position:relative;padding:4px 0 10px 18px;font-size:14.5px;line-height:1.55}.fc-tl li::before{content:"";position:absolute;left:-6px;top:10px;width:10px;height:10px;border-radius:50%;background:#111}
.fc-tl b{display:block;font-size:13px;color:#c62828}.fc-two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.fc-two h4{margin:12px 0 4px;font-size:14px}.fc-two p,.fc-two li{font-size:14px;line-height:1.6}.fc-two ul{padding-left:18px;margin:0}
.fc-cg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.fc-c{background:#fff;border-radius:14px;padding:16px 18px}
.fc-ch{display:flex;gap:12px;align-items:center}.fc-fl{font-size:34px;line-height:1}.fc-ch b{display:block;font-size:19px}
.fc-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.fc-chips a{font-size:13px;text-decoration:none;color:inherit;background:#f0f0ee;border-radius:999px;padding:4px 10px}.fc-chips i{font-style:normal;color:#fff;font-weight:700;border-radius:4px;padding:0 5px;margin-right:5px;font-size:11px}
.fc-c details{margin-top:8px}.fc-c summary{cursor:pointer;font-weight:700;font-size:14px}.fc-it{padding-left:18px;font-size:14px;line-height:1.6}.fc-c ol,.fc-c ul{font-size:14px}
@media (max-width:820px){.fc-sim{grid-template-columns:1fr}.fc-sim-im{aspect-ratio:16/9}.fc-two,.fc-cg{grid-template-columns:1fr}}
.links{display:flex;flex-wrap:wrap;gap:4px 14px}.links a{margin:0;white-space:nowrap}
</style></head><body><main>
<div id="gate" hidden><h1>운영자 전체 화면</h1><p class="cap">대표 전용 코드를 넣으면 이 브라우저에서는 다음부터 자동으로 열립니다.</p>
<input id="code" type="password" placeholder="운영자 코드" autocomplete="off" onkeydown="if(event.key==='Enter')document.getElementById('go').click()"><button id="go">열기</button><p id="err" class="ng"></p></div>
<div id="app" hidden></div>
</main>
<script src="/owner/art.js"></script>
<script>
(function(){
var U="https://raw.githubusercontent.com/leedukyoung74-wq/govradar-site/data/m/o.json";
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function b(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
async function open_(code){
  var j=await (await fetch(U+"?t="+Date.now(),{cache:"no-store"})).json();
  var k=await crypto.subtle.importKey("raw",new TextEncoder().encode("owner:"+code),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(j.s),iterations:j.iter,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
  var p=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(j.iv)},key,b(j.c));
  return JSON.parse(new TextDecoder().decode(p));
}
function render(d){
  var s=d.sum,h=[];
  h.push('<div class="bar"><div><h1>GOV RADAR 운영자 전체 화면</h1><p class="cap">기준 '+esc(d.at)+' · 대표만 볼 수 있는 화면 · 이 브라우저에 저장됨</p></div><div><a class="btn2" href="/ko/">사이트로</a> <button class="btn2" id="out">이 브라우저에서 잠그기</button></div></div>');
  h.push('<div class="kp"><div><b>'+s.countries+'/193</b>조사 국가</div><div><b>'+s.regions+'/23</b>자치·특별 지역</div><div><b>'+s.open+'</b>열린 입찰</div><div class="bl"><b>'+s.new+'</b>신규(7일)</div><div class="rd"><b>'+s.hot+'</b>마감 임박(D-15)</div><div><b>'+s.past+'</b>지난 입찰</div><div><b>'+s.biz+'</b>사업 기회</div></div>');
  h.push('<h2>열린 입찰 전체 <span class="cap">파랑=신규, 빨강=D-15 이내</span></h2><div class="tw"><table><tr><th>마감</th><th>D</th><th>국가</th><th>공고</th><th>발주처</th><th>출처</th></tr>');
  d.open.forEach(function(x){h.push('<tr class="'+(x.new?"new ":"")+(x.hot?"hot":"")+'"><td>'+x.dl+(x.new?'<span class="nb">신규</span>':'')+'</td><td>D-'+(x.d||"day")+'</td><td>'+esc(x.c)+'</td><td><a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.ko)+'</a>'+(x.ko!==x.orig?'<br><span class="cap">'+esc(x.orig)+'</span>':'')+'</td><td>'+esc(x.buyer)+'</td><td class="cap">'+esc(x.src)+'</td></tr>')});
  h.push('</table></div>');
  h.push('<h2>⌛ 지난 입찰 · 🔁 여러 나라 반복 수요 · 📋 타당성 준비</h2>');
  d.past.forEach(function(g){h.push('<div class="pc'+(g.multi?" m":"")+'"><b>'+esc(g.sec)+'</b> — 지난 입찰 '+g.n+'건 · '+g.countries.length+'개국'+(g.multi?' · 🔁 반복 수요':'')+'<p class="cap">'+esc(g.countries.join(", "))+'</p><details><summary>📁 지난 공고 '+g.items.length+'건</summary><ul>'+g.items.map(function(i){return '<li>📁 '+i.dl+' · '+esc(i.c)+' · '+(i.url?'<a href="'+esc(i.url)+'" target="_blank" rel="noopener">'+esc(i.ko)+'</a>':esc(i.ko))+'</li>'}).join("")+'</ul></details><details open><summary>📋 다음 공고 대비 타당성 준비</summary><ol>'+g.prep.map(function(p){return '<li>'+esc(p)+'</li>'}).join("")+'</ol></details></div>')});
  h.push('<h2>업데이트가 오래된 국가 (먼저 갱신할 곳)</h2><div class="tw" style="max-height:40vh"><table><tr><th>국가</th><th>마지막 갱신</th></tr>'+d.stale.map(function(x){return '<tr><td>'+esc(x.c)+'</td><td>'+esc(x.u||"—")+'</td></tr>'}).join("")+'</table></div>');
  h.push('<h2>자치·특별 지역</h2><p>'+d.regions.map(function(r){return (r.done?'<span class="ok">●</span> ':'<span class="cap">○</span> ')+esc(r.ko)+' <span class="cap">('+esc(r.p)+')</span>'}).join(" · ")+'</p>');
  if(d.fc){var F=d.fc,A=window.FCART||{},nS=F.scen_all.filter(function(x){return x.g==="S"}).length,nR=F.countries.reduce(function(a,x){return a+x.n},0);
   function fl(iso){return iso==="GLOBAL"?"🌍":iso.replace(/./g,function(c){return String.fromCodePoint(127397+c.charCodeAt(0))})}
   function pic(im){return im[0]==="ph"?'<img src="https://images.unsplash.com/'+im[1]+'?auto=format&fit=crop&q=70&w=900&h=520" alt="" referrerpolicy="no-referrer">':(A[im[1]]||"")}
   var G={S:"#c62828",A:"#d9822b",B:"#3b6fd6",C:"#777"};
   h.push('<section class="fc-hero" id="fc"><p class="fc-eb">대표 전용 · 발언자 이름 없음 · 사실 검증 대상 아님 · 공개 사이트에 옮기지 않음</p><h2>국가별 미래 시나리오와 대비</h2><p class="fc-lede">여러 발언이 겹치는 흐름을 시나리오로 묶고, 지금 공식적으로 확인된 징후와 함께 봅니다. 아래 가상 시나리오는 대비를 위한 연습이며 예측이 아닙니다.</p><div class="fc-k"><div><b>'+F.countries.length+'</b>나라·권역</div><div><b>'+nR+'</b>기록</div><div><b>'+F.scen_all.length+'</b>시나리오</div><div><b>'+nS+'</b>S등급</div></div></section>');
   h.push('<h2 class="fc-h">시나리오 한눈에 <span class="cap">등급 = 겹침 정도 + 확인된 징후 (확률 아님)</span></h2><div class="fc-sg">'+F.scen_all.map(function(x){return '<a class="fc-sc" href="#sim-'+x.id+'"><div class="fc-im">'+pic(x.img)+'<span class="fc-g" style="background:'+G[x.g]+'">'+x.g+'</span></div><b>'+esc(x.ko)+'</b><span class="cap">기록 '+x.n+'건 · '+esc(x.countries.join(", ")||"—")+'</span></a>'}).join("")+'</div>');
   h.push('<h2 class="fc-h">가상 시나리오 — 이렇게 흘러간다면 <span class="cap">대비 연습용 · 예측 아님</span></h2>');
   F.scen_all.forEach(function(x){var m=x.sim;if(!m)return;h.push('<article class="fc-sim" id="sim-'+x.id+'"><div class="fc-sim-im">'+pic(x.img)+'</div><div class="fc-sim-b"><p class="fc-tag"><span style="background:'+G[x.g]+'">'+x.g+'</span> 가상 시나리오</p><h3>'+esc(x.ko)+'</h3><p class="fc-pr">'+esc(m.premise)+'</p><ol class="fc-tl">'+m.tl.map(function(t){return '<li><b>'+esc(t[0])+'</b><span>'+esc(t[1])+'</span></li>'}).join("")+'</ol><div class="fc-two"><div><h4>한국에 오는 영향</h4><p>'+esc(m.kr)+'</p><h4>우리가 먼저 움직일 것</h4><p>'+esc(m.biz)+'</p></div><div><h4>이 신호가 보이면 단계 올림</h4><ul>'+m.watch.map(function(w){return '<li>'+esc(w)+'</li>'}).join("")+'</ul><h4>평시로 되돌리는 기준</h4><p>'+esc(m.exit)+'</p>'+(x.ind&&x.ind.length?'<h4>지금 확인된 공식 징후</h4><ul>'+x.ind.map(function(w){return '<li>'+esc(w)+'</li>'}).join("")+'</ul>':'')+'</div></div></div></article>')});
   h.push('<h2 class="fc-h">나라별 기록과 대비</h2><p class="links">'+F.countries.map(function(x){return '<a href="#fc-'+x.iso+'">'+fl(x.iso)+' '+esc(x.c)+' '+x.n+'</a>'}).join("")+'</p><div class="fc-cg">');
   F.countries.forEach(function(x){h.push('<div class="fc-c" id="fc-'+x.iso+'"><div class="fc-ch"><span class="fc-fl">'+fl(x.iso)+'</span><div><b>'+esc(x.c)+'</b><span class="cap">기록 '+x.n+'건</span></div></div>'+(x.scen.length?'<p class="fc-chips">'+x.scen.map(function(s){return '<a href="#sim-'+s.id+'"><i style="background:'+G[s.g]+'">'+s.g+'</i>'+esc(s.ko)+'</a>'}).join("")+'</p>':'<p class="cap">단일 기록 — 겹치는 시나리오 없음</p>')+
    '<details'+(x.n<=5?' open':'')+'><summary>기록 (최신순)</summary><ul class="fc-it">'+x.items.map(function(i){return '<li><span class="cap">'+esc(i.date)+' · '+esc(i.topic)+' · '+esc(i.st)+'</span><br>'+esc(i.claim)+'</li>'}).join("")+'</ul></details>'+
    (x.prep.length?'<details><summary>대비 (기업·가정) '+x.prep.length+'</summary><ol>'+x.prep.map(function(t){return '<li>'+esc(t)+'</li>'}).join("")+'</ol></details>':'')+
    (x.biz.length?'<details><summary>미리 준비할 사업 '+x.biz.length+'</summary><ul>'+x.biz.map(function(t){return '<li>'+esc(t)+'</li>'}).join("")+'</ul></details>':'')+'</div>')});
   h.push('</div>')}
  h.push('<h2>자동 작업 상태</h2><table><tr><th>작업</th><th>상태</th></tr>'+d.tasks.map(function(t){return '<tr><td>'+esc(t.n)+'</td><td class="'+(t.s==="정상"?"ok":"ng")+'">'+(t.on?"켜짐":"꺼짐")+' · '+esc(t.s)+'</td></tr>'}).join("")+'</table>');
  h.push('<h2>바로가기</h2><p class="links"><a href="/ko/mdb/">입찰·마감 보드</a><a href="/ko/mdb/#past">지난 입찰·타당성</a><a href="/ko/">홈</a><a href="/pay/">결제(준비 중)</a><a href="https://dash.cloudflare.com/" target="_blank" rel="noopener">Cloudflare</a><a href="https://app.netlify.com/projects/wmm-govradar/forms" target="_blank" rel="noopener">신청서(Netlify)</a><a href="https://github.com/leedukyoung74-wq/govradar-site" target="_blank" rel="noopener">GitHub</a></p>');
  var a=document.getElementById("app");a.innerHTML=h.join("");a.hidden=false;
  document.getElementById("out").onclick=function(){ls("gv_owner",null);location.reload()};
}
async function start(code){
  try{var d=await open_(code);ls("gv_owner",code);if(d.mcode)ls("gv_code",d.mcode);document.getElementById("gate").hidden=true;render(d);if(location.hash)history.replaceState(null,"",location.pathname)}
  catch(e){document.getElementById("gate").hidden=false;document.getElementById("err").textContent="코드가 맞지 않거나 자료를 불러오지 못했습니다."}
}
var c=decodeURIComponent((location.hash||"").slice(1))||ls("gv_owner");
document.getElementById("go").onclick=function(){start(document.getElementById("code").value.trim())};
if(c)start(c);else document.getElementById("gate").hidden=false;
})();
</script></body></html>
