# WMM GOV RADAR: manual, read-only, ONE request; never writes branches, artifacts or secrets.
name: WMM DAPA API one-request verification (NO PUBLISH)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate DAPA approval and endpoint with one small GET
        shell: bash
        env:
          DAPA_KEY: ${{ secrets.DAPA_KEY }}
        run: |
          python - <<'PY'
          import datetime
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          key = os.getenv("DAPA_KEY", "").strip()
          if not key:
              print("DAPA_AUTH_STATUS=SECRET_NOT_CONFIGURED")
              sys.exit(1)
          print("DAPA_AUTH_STATUS=SECRET_PRESENT_VALUE_HIDDEN")
          today = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).date()
          q = {
              "serviceKey": key,
              "pageNo": "1",
              "numOfRows": "3",
              "inqryBgnDt": (today - datetime.timedelta(days=14)).strftime("%Y%m%d"),
              "inqryEndDt": today.strftime("%Y%m%d"),
          }
          # The URL contains a secret. NEVER print request URLs, exceptions, response text or tracebacks.
          url = "https://apis.data.go.kr/1690000/DCAIBidInfoService/getDCAIBidInfoList?" + urllib.parse.urlencode(q, safe="%")
          try:
              req = urllib.request.Request(url, headers={"User-Agent": "WMM-GOV-RADAR-DAPA-readonly-check/1.0"})
              with urllib.request.urlopen(req, timeout=25) as resp:
                  code = resp.status
                  body = resp.read(100000)
          except urllib.error.HTTPError as ex:
              print("DAPA_HTTP_STATUS=" + str(ex.code))
              print("DAPA_CHECK=HTTP_ERROR")
              sys.exit(1)
          except Exception:
              print("DAPA_CHECK=NETWORK_OR_REQUEST_ERROR")
              sys.exit(1)
          print("DAPA_HTTP_STATUS=" + str(code))
          try:
              root = ET.fromstring(body)
          except ET.ParseError:
              print("DAPA_CHECK=NON_XML_RESPONSE")
              sys.exit(1)
          tag = re.sub(r"[^A-Za-z0-9_-]", "", root.tag.rsplit("}",1)[-1])[:50]
          print("DAPA_XML_ROOT=" + tag)
          values = [
              (e.tag.rsplit("}",1)[-1].lower(), str(e.text or "").strip())
              for e in root.iter()
              if isinstance(e.tag, str)
          ]
          error_codes = [
              v for name,v in values
              if name in ("resultcode","returnreasoncode","errorcode") and v
          ]
          if error_codes:
              safe_code = re.sub(r"[^A-Za-z0-9_-]", "", error_codes[0])[:30]
              print("DAPA_PROVIDER_RESULT_CODE=" + safe_code)
              if safe_code.upper() not in ("00", "0", "000", "NORMAL_SERVICE"):
                  print("DAPA_CHECK=PROVIDER_DENIED_OR_ERROR")
                  sys.exit(1)
          else:
              print("DAPA_PROVIDER_RESULT_CODE=NOT_FOUND_IN_XML")
          count = sum(1 for e in root.iter() if isinstance(e.tag,str) and e.tag.rsplit("}",1)[-1].lower()=="item")
          print("DAPA_ITEM_COUNT_IN_TEST_PAGE=" + str(count))
          if tag.lower().endswith("openapi_serviceresponse") or "error" in tag.lower():
              print("DAPA_CHECK=ERROR_RESPONSE")
              sys.exit(1)
          print("DAPA_CHECK=REACHABLE_XML")
          print("NOTE: This verifies a single small request only, not tender data freshness or production publication.")
          PY
