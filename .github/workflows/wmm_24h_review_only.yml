name: WMM 24h review cycle (NO DEPLOY)
on:
  pull_request:
    branches: [src]
    paths:
      - '.github/workflows/wmm_24h_review_only.yml'
      - 'tools/wmm_24h_review_cycle.py'
      - 'tests/test_wmm_24h_review_cycle.py'
      - 'docs/WMM_24H_AUTONOMOUS_BUILD_RUNBOOK_20261120.md'
  workflow_dispatch:
    inputs:
      cycle_index:
        description: 'Review-only preview cycle, 0 through 23'
        required: false
        type: choice
        default: '0'
        options: ['0', '4', '8', '12', '16', '20', '23']
  # Prepared only. GitHub schedule executes from DEFAULT branch, never a draft PR.
  # Even after a future approved merge to default, the flag and 24h window must be set.
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: wmm-24h-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review_only:
    if: github.event_name != 'schedule' || vars.WMM_24H_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout only; never persist write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed eligibility check (one 24-hour window)
        id: gate
        env:
          WMM_CYCLE_INDEX: ${{ inputs.cycle_index || '0' }}
          WMM_24H_REVIEW_ENABLED: ${{ vars.WMM_24H_REVIEW_ENABLED }}
          WMM_24H_REVIEW_START_UTC: ${{ vars.WMM_24H_REVIEW_START_UTC }}
        run: python tools/wmm_24h_review_cycle.py gate
      - name: Test scheduling and explicit review-only safety
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s tests -p 'test_wmm_24h_review_cycle.py' -v
      - name: Test common customer intake contract offline
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s tests -p 'test_wmm_intake_contract.py' -v
      - name: Test GOV RADAR exporter safety offline
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m unittest discover -s tests -p 'test_export_inputs.py' -v
          python -m unittest discover -s tests -p 'test_research_coverage.py' -v
      - name: Write metadata-only evidence (no customer content)
        if: steps.gate.outputs.run == 'true'
        env:
          WMM_CYCLE_INDEX: ${{ steps.gate.outputs.cycle }}
        run: python tools/wmm_24h_review_cycle.py report --cycle "$WMM_CYCLE_INDEX"
      - name: Store short review-only report
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wmm-24h-review-cycle-${{ steps.gate.outputs.cycle }}
          path: review-evidence/
          if-no-files-found: error
          retention-days: 1
