name: GOV RADAR customer-facing public route gate QA (NO DEPLOY)
on:
  pull_request:
    branches: [src]
    paths:
      - 'build.py'
      - 'tests/customer-public-route-gate.test.cjs'
      - '.github/workflows/wmm_customer_public_gate_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer_public_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify first-time anonymous customer journeys without a browser session
        run: node tests/customer-public-route-gate.test.cjs
      - name: No POST and no production deployment
        run: echo 'READ ONLY - no customer form submissions, paid services, secrets, live/data writes or deployment'
