name: WMM Official NWS + CISA KEV public updates
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/wmm_nws_cisa_timer.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test only by default. False publishes official public snapshots.'
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  verified_nws_cisa:
    uses: leedukyoung74-wq/govradar-site/.github/workflows/wmm_nws_cisa_official.yml@src
    with:
      dry_run: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.dry_run) }}
