name: WMM GOV RADAR hourly public operations watch
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/wmm_operations_watch.yml
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify scheduled runs, public data freshness and deployed site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt, json, os, sys, urllib.parse, urllib.request, urllib.error
          UTC=dt.timezone.utc
          KST=dt.timezone(dt.timedelta(hours=9))
          now=dt.datetime.now(UTC)
          repo='leedukyoung74-wq/govradar-site'
          raw='https://raw.githubusercontent.com/'+repo+'/data/hz/'
          checks=[]
          def record(label, ok, detail):
              obj={'item':label,'ok':bool(ok),'detail':detail}
              checks.append(obj)
              print(json.dumps(obj,ensure_ascii=False,sort_keys=True),flush=True)
          def get(url, github=False, json_only=False, max_bytes=1_000_000):
              host=urllib.parse.urlsplit(url).hostname
              allowed={'api.github.com'} if github else {'raw.githubusercontent.com','radar.wmm-hoa.com','wmm-radar.pages.dev'}
              if host not in allowed or not url.startswith('https://'):
                  raise ValueError('host_not_allowlisted')
              headers={'User-Agent':'WMM-GOV-RADAR-Operations-Watch/1.0','Accept':'application/vnd.github+json' if github else '*/*'}
              if github and os.environ.get('GH_TOKEN'):
                  headers['Authorization']='Bearer '+os.environ['GH_TOKEN']
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r:
                  if r.status!=200: raise RuntimeError('HTTP_'+str(r.status))
                  if urllib.parse.urlsplit(r.geturl()).hostname not in allowed: raise ValueError('redirect_not_allowlisted')
                  body=r.read(max_bytes+1)
                  if len(body)>max_bytes: raise ValueError('response_too_large')
                  text=body.decode('utf-8','replace')
              return json.loads(text) if json_only else text
          def parse_time(s, naive_tz=UTC):
              if not s:return None
              try:
                  o=dt.datetime.fromisoformat(str(s).replace('Z','+00:00'))
                  if o.tzinfo is None:o=o.replace(tzinfo=naive_tz)
                  return o.astimezone(UTC)
              except (ValueError,TypeError,OverflowError):return None
          def age_minutes(s, tz=UTC):
              t=parse_time(s,tz)
              return None if not t else round((now-t).total_seconds()/60,1)
          def fresh(s, minutes, tz=UTC):
              age=age_minutes(s,tz)
              return age is not None and -5<=age<=minutes
          try:
              data=get(raw+'official.json',json_only=True)
              us=data.get('sources',{}).get('usgs',{})
              age=age_minutes(data.get('usgs_fast_checked'),KST)
              record('USGS official fast',us.get('ok') is True and fresh(data.get('usgs_fast_checked'),120,KST),
                     {'minutes_since_fast_checked':age,'items':us.get('n')})
              other={k:age_minutes(data.get('sources',{}).get(k,{}).get('last_ok'),KST) for k in ('gdacs','eonet','who','cneos','swpc')}
              record('Other five agencies daily freshness',all(v is not None and -5<=v<=36*60 for v in other.values()),
                     {'minutes_since_last_ok':other})
          except Exception as exc:
              record('Official disaster feed',False,type(exc).__name__)
          # Government opportunity notices are a separate critical product from the hazard radar.
          # Check the PUBLIC data branch; successful local collection is not sufficient.
          feed_root='https://raw.githubusercontent.com/'+repo+'/data/feeds/'
          observed={}
          for label,filename,minimum in (
              ('Official-source tender cache','tenders.json',100),
              ('Country-summary listed tender estimate','cty/_summary.json',1),
              ('Contract awards','awards.json',100)):
              try:
                  d=get(feed_root+filename,json_only=True,max_bytes=2_500_000)
                  count=(d.get('t') or {}).get('n') if filename.startswith('cty/') else d.get('count')
                  updated=d.get('updated')
                  good=isinstance(count,int) and count>=minimum and fresh(updated,30*60)
                  if filename=='tenders.json':
                      _items=d.get('items')
                      good=good and isinstance(_items,list) and len(_items)==count
                      _known_sources={
                          'World Bank':'projects.worldbank.org',
                          'UK Find a Tender':'www.find-tender.service.gov.uk',
                          'EU TED':'ted.europa.eu',
                          'Prozorro (Ukraine)':'prozorro.gov.ua',
                          'UK Contracts Finder':'www.contractsfinder.service.gov.uk',
                          'SAM.gov (US)':'sam.gov'
                      }
                      _grades={}
                      _sources_safe=True
                      for _rec in _items if isinstance(_items,list) else []:
                          _grade=str(_rec.get('verify') or 'missing')
                          _grades[_grade]=_grades.get(_grade,0)+1
                          _link=urllib.parse.urlsplit(str(_rec.get('url') or ''))
                          _sources_safe=_sources_safe and (
                              _link.scheme=='https' and
                              _link.hostname==_known_sources.get(_rec.get('source')) and
                              not _link.username and not _link.password and
                              _link.port is None and not _link.fragment)
                      good=good and _sources_safe
                      _publisher_reread=sum(
                          _rec.get('verify') in ('full','date') and not _rec.get('stale')
                          for _rec in _items if isinstance(_items,list))
                      _cached_unconfirmed_search=sum(
                          _rec.get('verify')=='search'
                          for _rec in _items if isinstance(_items,list))
                      _stale_partial=sum(
                          bool(_rec.get('stale')) for _rec in _items if isinstance(_items,list))
                  observed[filename]=count
                  _detail={'age_minutes':age_minutes(updated),'items':count,'updated':updated,
                           'threshold_minutes':30*60}
                  if filename=='tenders.json':
                      _detail.update({'verification_grades':_grades,
                          'search_only_not_individually_confirmed':_cached_unconfirmed_search,
                          'publisher_rerecheck_grade_count':_publisher_reread,
                          'stale_labeled_cached_records':_stale_partial,
                          'only_reviewed_official_hosts':_sources_safe,
                          'not_a_live_confirmed_tender_count':True})
                  record(label,good,_detail)
              except Exception as exc:
                  record(label,False,{'error':type(exc).__name__})
          # Source-level ingestion health is separate from cached tender URL safety.
          # Never treat stale carried SAM notices as a successful fresh collection.
          try:
              provider=get(feed_root+'sources_status.json',json_only=True,max_bytes=500_000)
              s=provider.get('SAM.gov (US)',{})
              state=str(s.get('state') or 'UNKNOWN')
              success_age=age_minutes(s.get('last_success'))
              latest_ok=state in ('SUCCESS','EMPTY_SUCCESS','PARTIAL') and success_age is not None and -5<=success_age<=36*60
              record('US SAM.gov verified ingestion',latest_ok,{
                  'state':state,
                  'last_success_age_minutes':success_age,
                  'checked':s.get('checked'),
                  'confirmed_new_today':s.get('new_today'),
                  'provider_last_error':'RATE_LIMITED_429' if any('429' in str(n) for n in s.get('notes',[])) else None,
                  'sampled_records_stale':s.get('carried_stale',0)})
              d=provider.get('DAPA (Korea)',{})
              provenance=bool(d.get('state') in ('SUCCESS','PARTIAL') and d.get('date_filter_verified') is False and
                             d.get('data_freshness')=='HISTORICAL_SAMPLE')
              record('Korea DAPA archival provenance',provenance,{
                  'state':d.get('state'),
                  'sampling':d.get('coverage'),
                  'sample_latest_deadline':d.get('sampled_latest_bid_to'),
                  'verified_current_notices':d.get('kept',0),
                  'not_a_current_tender_feed':True})
          except Exception as exc:
              record('DAPA/SAM source-specific ingestion',False,{'error':type(exc).__name__})
          if 'tenders.json' in observed and 'cty/_summary.json' in observed:
              n=observed['tenders.json']; c=observed['cty/_summary.json']
              record('Country-summary listed vs cached tender upper bound',
                     isinstance(n,int) and isinstance(c,int) and 0<=c<=n,
                     {'verified_open':c,'all_tenders':n})
          for name,filename,limit in (('US NWS weather','nws_active.json',180),('CISA KEV','cisa_kev.json',10*60)):
              try:
                  d=get(raw+filename,json_only=True)
                  h=d.get('source_health',{})
                  age=age_minutes(h.get('last_ok'))
                  ok=h.get('ok') is True and h.get('stale') is False and fresh(h.get('last_ok'),limit)
                  if name=='CISA KEV':
                      ok=ok and d.get('not_realtime_attack_feed') is True and d.get('total_vulnerabilities',0)>=1000
                  record(name,ok,{'minutes_since_last_ok':age,'items_displayed':len(d.get('items',[])),
                                  'source_error':h.get('last_error'),'source_health_ok':h.get('ok')})
              except Exception as exc:
                  record(name,False,type(exc).__name__)
          url='https://api.github.com/repos/'+repo+'/actions/runs?event=schedule&per_page=30'
          first_nws=dt.datetime(2026,11,19,4,54,tzinfo=UTC)
          expected=(
              ('USGS five-minute schedule','WMM GOV RADAR fast official data publishing',150,dt.datetime(2026,11,19,4,39,tzinfo=UTC)),
              ('NWS/CISA 15-minute schedule','WMM Official NWS + CISA KEV public updates',180,first_nws))
          try:
              runs=get(url,github=True,json_only=True,max_bytes=2_000_000).get('workflow_runs',[])
              for label,name,limit,start in expected:
                  found=sorted((r for r in runs if r.get('name')==name and r.get('event')=='schedule'),key=lambda r:r.get('created_at') or '',reverse=True)
                  if not found and (now-start).total_seconds()<3*3600:
                      record(label,True,{'state':'initial_grace_period_NOT_YET_PROVEN','scheduled_runs_seen':0,'pending':True,
                                         'grace_ends_utc':(start+dt.timedelta(hours=3)).isoformat()})
                      continue
                  recent=found[0] if found else None
                  age=age_minutes(recent.get('created_at')) if recent else None
                  conclusion=recent.get('conclusion') if recent else None
                  detail={'last_run_id':recent.get('id') if recent else None,
                          'last_conclusion':conclusion,
                          'minutes_since_last_scheduled_run':age,
                          'source_freshness_checked_separately':True}
                  if conclusion in ('failure','timed_out'):
                      # An actual failed scheduled job is an actionable failure.
                      record(label,False,dict(detail,state='SCHEDULE_JOB_FAILED'))
                  elif recent and age is not None and -5<=age<=limit and conclusion=='success':
                      record(label,True,dict(detail,state='SCHEDULE_EVENT_VERIFIED'))
                  else:
                      # GitHub best-effort cron can be delayed/missed. A missed
                      # scheduling event is NOT proof that the official public
                      # data are stale: checks above enforce freshness and fail
                      # the run if USGS, NWS, CISA or tender feeds are stale.
                      # Report a distinct PENDING schedule gap, never fake a
                      # five-/fifteen-minute execution SLA.
                      record(label,True,dict(detail,state='SCHEDULE_GAP_UNVERIFIED',pending=True))
          except ValueError as exc:
              code=str(exc)
              record('GitHub scheduled events check',False,{'error':'ValueError','reason':code if code in ('host_not_allowlisted','redirect_not_allowlisted','response_too_large') else 'unexpected_value_error'})
          except Exception as exc:
              record('GitHub scheduled events check',False,{'error':type(exc).__name__})
          for label,path,needle in (
              ('KO cyber website','/cyber/?stay=1','wmm-official-sources.js'),
              ('EN cyber website','/cyber/en/?stay=1','wmm-official-sources.js'),
              ('Global hazards website','/hazards/?stay=1','wmm-official-sources.js'),
              ('Public panel JavaScript','/assets/wmm-official-sources.js','cisa_kev.json')):
              try:
                  html=get('https://radar.wmm-hoa.com'+path)
                  record(label,needle in html,{'http':200,'expected_marker_present':needle in html})
              except Exception as exc:
                  record(label,False,type(exc).__name__)
          # Customer trust: research candidate index is NEVER the verified tender feed.
          # Existing hourly cron only. No API charges, customer data, mail or deployment.
          for _host,_label in (('radar.wmm-hoa.com','Custom domain'),('wmm-radar.pages.dev','Cloudflare origin')):
              try:
                  _d=get('https://'+_host+'/data/opps.json',json_only=True,max_bytes=1_000_000)
                  _rows=_d.get('items')
                  _widget=get('https://'+_host+'/widget/',max_bytes=40_000)
                  _root_ok=(_d.get('index_kind')=='unverified_country_brief_candidates'
                      and type(_d.get('verified_official_notice_count')) is int
                      and _d['verified_official_notice_count']==0
                      and _d.get('automated_customer_alerts_allowed') is False)
                  _records_ok=(isinstance(_rows,list) and len(_rows)>=600
                      and all(isinstance(_x,dict) and
                          _x.get('source_review_status')=='individual_notice_unverified' and
                          _x.get('official_notice_verified') is False and
                          _x.get('may_send_business_alert') is False and
                          _x.get('is_live_tender') is False for _x in _rows))
                  _widget_ok=('id="source-disclaimer" role="note"' in _widget
                      and 'x.official_notice_verified===true&&x.deadline?' in _widget
                      and 'o.automated_customer_alerts_allowed!==false' in _widget)
                  record('Country brief provenance ('+_label+')',_root_ok and _records_ok and _widget_ok,
                      {'records':len(_rows) if isinstance(_rows,list) else None,
                       'min_expected':600,'official_notices_confirmed':0,
                       'automated_alerts_allowed':False,
                       'root_policy_valid':_root_ok,'each_record_unverified':_records_ok,
                       'seven_language_widget_guard':_widget_ok})
              except Exception as exc:
                  record('Country brief provenance ('+_label+')',False,{'error':type(exc).__name__})
          # M1 billing truth: public amount must match backend's real
          # authoritative product table. A GET-only audit never charges or
          # grants memberships; disabled payment is reported, NOT auto-enabled.
          try:
              _cfg=get('https://radar.wmm-hoa.com/pay/config',
                       json_only=True,max_bytes=8_000)
              _prices=_cfg.get('products',{})
              _month=(_prices.get('analysis-month') or {}).get('amount')
              _annual=(_prices.get('analysis-year') or {}).get('amount')
              _price_good=(type(_month) is int and type(_annual) is int
                           and _month==20000 and _annual==200000)
              record('M1 published payment backend KRW/VAT price parity',
                     _price_good,{'monthly_krw':_month,'annual_krw':_annual,
                                  'checkout_enabled':_cfg.get('enabled') is True,
                                  'live_payment_and_entitlement_verified':False})
          except Exception as exc:
              record('M1 published payment backend KRW/VAT price parity',
                     False,{'error_type':type(exc).__name__})
          # Anonymous GET status is a security sentinel only. It cannot prove
          # Netlify Forms POST delivery, D1 writes, role assignment, or billing.
          class NoAnonymousRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  return None
          _gate=urllib.request.build_opener(NoAnonymousRedirect)
          for _route,_required,_label in (
              ('/nfform',405,'Anonymous form relay GET refused (POST-only)'),
              ('/api/req',401,'Anonymous member request GET denied'),
              ('/mkey',401,'Anonymous member secret GET denied')):
              try:
                  _req=urllib.request.Request(
                      'https://radar.wmm-hoa.com'+_route,
                      method='GET',headers={'User-Agent':'WMM-no-auth-GET-security-gate/1.0'})
                  try:
                      with _gate.open(_req,timeout=12) as _r:
                          _status=_r.status
                  except urllib.error.HTTPError as _e:
                      _status=_e.code
                  record(_label,_status==_required,{
                      'http_status':_status,'required':_required,
                      'no_credentials_or_customer_post':True,
                      'end_to_end_backend_verified':False})
              except Exception as exc:
                  record(_label,False,{'error_type':type(exc).__name__})
          summary_path=os.environ.get('GITHUB_STEP_SUMMARY')
          failed=[x for x in checks if not x['ok']]
          pending=[x for x in checks if isinstance(x.get('detail'),dict) and x['detail'].get('pending')]
          result='FAIL' if failed else ('PENDING' if pending else 'PASS')
          table=['## WMM GOV RADAR hourly public health: '+result,'',
                 '| Check | Result |','|---|---|']
          for x in checks:table.append('| '+x['item']+' | '+('PENDING' if isinstance(x.get('detail'),dict) and x['detail'].get('pending') else ('PASS' if x['ok'] else 'FAIL'))+' |')
          table.append('')
          table.append('Data are public-source only. Cron gaps are PENDING, while stale source data or failed runs are FAIL. GitHub does not guarantee exact five-minute execution.')
          if summary_path:
              with open(summary_path,'a',encoding='utf-8') as f:
                  f.write('\n'.join(table)+'\n')
          print(json.dumps({'result':result,'failed_checks':[x['item'] for x in failed],'checked':len(checks),
                            'pending_checks':[x['item'] for x in pending], 'checked_at_utc':now.isoformat()},ensure_ascii=False))
          sys.exit(1 if failed else 0)
          PY
      - name: Read-only checkout for provenance report (no deployment)
        if: always()
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Detect manual snapshots and search-level tender verification
        if: always()
        run: python3 ops/wmm_public_source_truth_report.py
      - name: GET-only seven-language homepage and source copy check
        if: always()
        run: python3 ops/wmm_seven_locale_readonly.py
