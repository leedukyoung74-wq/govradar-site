name: WMM GOV RADAR member-intake security integrated QA (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'cf/functions/nfform.js'
      - 'web/auth.js'
      - 'tools/member.py'
      - 'tools/member_rekey.py'
      - 'tests/wmm_form_*'
      - 'tests/test_auth_*'
      - 'member_security_checks/**'
      - '.github/workflows/wmm_govradar_member_intake_integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate static and function JavaScript syntax
        run: |
          node --check web/auth.js
          node --check cf/functions/nfform.js
          node --check scripts/wmm_form_routes_audit.mjs
      - name: Prove mock OAuth/consent/membership behavior, never send emails
        run: node --test tests/test_auth_marketing_consent.test.cjs tests/test_auth_oauth_return.test.cjs tests/test_auth_membership_tiers.test.cjs
      - name: Prove mock form routing and relay fail-closed behavior, no live requests
        run: node --test tests/wmm_form_relay.test.mjs tests/wmm_form_routes_audit.test.mjs
      - name: Test local fake-member key rotation only
        run: |
          python -m pip install --disable-pip-version-check cryptography
          python -m unittest discover -s member_security_checks -p 'test_rekey.py' -v
      - name: Checkout existing live branch only for offline static form audit
        uses: actions/checkout@v4
        with:
          ref: live
          path: live-branch
          persist-credentials: false
      - name: Check real generated live form routes, without submission
        run: |
          test -f live-branch/functions/nfform.js
          node scripts/wmm_form_routes_audit.mjs live-branch/public
          node --test tests/wmm_form_live_contract.test.mjs
      - name: Assert no tests changed repository files
        run: git diff --exit-code
