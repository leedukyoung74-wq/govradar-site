name: WMM resilience isolated review checks
on:
  pull_request:
    paths:
      - 'assets/wmm-resilience.*'
      - 'data/wmm-food-country-profiles.json'
      - '**/resilience/index.html'
      - 'tests/check_wmm_resilience.py'
      - 'tests/test_wmm_resilience_runtime.cjs'
      - 'tests/check_wmm_legacy_overlap.cjs'
      - 'docs/WMM_RESILIENCE_INTEGRATION_REVIEW_20261119.md'
      - '.github/workflows/wmm_resilience_check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check assets/wmm-resilience.js
      - name: JavaScript runtime smoke test (no browser/network)
        run: node tests/test_wmm_resilience_runtime.cjs
      - name: Legacy prepare overlap diagnostics (read-only)
        run: node tests/check_wmm_legacy_overlap.cjs
      - name: Data and markup invariants
        run: python3 tests/check_wmm_resilience.py
