# Reusable feed job — the ONE place that defines how feeds are collected.
# Called by: main/.github/workflows/schedule.yml (daily 06:10 KST and weekly source check, once the owner approves it),
#            feeds-dryrun.yml in this branch (no publishing), and can be run by hand.
# dry_run=true runs every collector and the checks but never pushes to the data branch; outputs are kept as a run artifact.
name: Feeds (reusable)
on:
  workflow_call:
    inputs:
      task:     { type: string, default: daily }        # daily | sources
      code_ref: { type: string, default: src }          # branch or SHA whose collector code runs
      dry_run:  { type: boolean, default: false }
    secrets:
      DAPA_KEY: { required: false }
      SAM_KEY:  { required: false }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Isolate review-only runs by branch; production keeps its single live writer queue.
    concurrency: { group: "feeds-${{ inputs.dry_run && (github.head_ref || github.ref_name) || 'live' }}", cancel-in-progress: "${{ inputs.dry_run }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.code_ref }}" }
      - uses: actions/checkout@v4
        with: { ref: data, path: data_branch, fetch-depth: 50 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Generated-page tests require the same local static preview built by tests.yml.
      # Both outputs are disposable runner files; never upload or deploy these pages.
      - name: Build static preview needed by offline tests (NO DEPLOY)
        run: |
          python3 build.py --base https://radar.wmm-hoa.com
          python3 tools/cf_variant.py dist cf/public
      - name: Offline tests first (stop before touching data if the code is broken)
        run: python -m unittest discover -s tests
      - name: Initialize per-run optional collector evidence (no customer data)
        if: inputs.task == 'daily'
        run: |
          : > "$RUNNER_TEMP/wmm_optional_collectors.tsv"
      - name: Collect tenders (keys are optional; sources without a key are SKIPPED)
        if: inputs.task == 'daily'
        run: python tools/feed_tenders.py
        env: { DAPA_KEY: "${{ secrets.DAPA_KEY }}", SAM_KEY: "${{ secrets.SAM_KEY }}" }
      - if: inputs.task == 'daily'
        run: |
          if python3 tools/feed_intel.py; then
            printf 'feed_intel\tPASS\n' >> "$RUNNER_TEMP/wmm_optional_collectors.tsv"
          else
            printf 'feed_intel\tFAIL\n' >> "$RUNNER_TEMP/wmm_optional_collectors.tsv"
            echo "::warning title=WMM collector degraded::feed_intel failed; last good files may be retained. See redacted run artifact."
          fi
      - if: inputs.task == 'daily'
        run: |
          if python3 tools/feed_cty.py; then
            printf 'feed_cty\tPASS\n' >> "$RUNNER_TEMP/wmm_optional_collectors.tsv"
          else
            printf 'feed_cty\tFAIL\n' >> "$RUNNER_TEMP/wmm_optional_collectors.tsv"
            echo "::warning title=WMM collector degraded::feed_cty failed; last good files may be retained. See redacted run artifact."
          fi
      - name: Official situation feed (USGS, GDACS, NASA EONET, WHO, NASA JPL, NOAA) — no AI
        if: inputs.task == 'daily'
        run: |
          if python3 tools/feed_official.py; then
            printf 'feed_official\tPASS\n' >> "$RUNNER_TEMP/wmm_optional_collectors.tsv"
          else
            printf 'feed_official\tFAIL\n' >> "$RUNNER_TEMP/wmm_optional_collectors.tsv"
            echo "::warning title=WMM collector degraded::feed_official failed; last good files may be retained. See redacted run artifact."
          fi
      - name: Situation board disasters from the official feed (no AI) — keeps the editorial summary as is
        if: inputs.task == 'daily'
        run: |
          if python3 tools/hz_disasters.py; then
            printf 'hz_disasters\tPASS\n' >> "$RUNNER_TEMP/wmm_optional_collectors.tsv"
          else
            printf 'hz_disasters\tFAIL\n' >> "$RUNNER_TEMP/wmm_optional_collectors.tsv"
            echo "::warning title=WMM collector degraded::hz_disasters failed; last good files may be retained. See redacted run artifact."
          fi
      - name: Country economy feed (World Bank indicators, exchange rates) — no AI
        if: inputs.task == 'daily'
        run: |
          if python3 tools/feed_econ.py; then
            printf 'feed_econ\tPASS\n' >> "$RUNNER_TEMP/wmm_optional_collectors.tsv"
          else
            printf 'feed_econ\tFAIL\n' >> "$RUNNER_TEMP/wmm_optional_collectors.tsv"
            echo "::warning title=WMM collector degraded::feed_econ failed; last good files may be retained. See redacted run artifact."
          fi
      - name: Sanctions lists (UN, US OFAC, EU, UK) — no AI
        if: inputs.task == 'daily'
        run: |
          if python3 tools/feed_sanctions.py; then
            printf 'feed_sanctions\tPASS\n' >> "$RUNNER_TEMP/wmm_optional_collectors.tsv"
          else
            printf 'feed_sanctions\tFAIL\n' >> "$RUNNER_TEMP/wmm_optional_collectors.tsv"
            echo "::warning title=WMM collector degraded::feed_sanctions failed; last good files may be retained. See redacted run artifact."
          fi
      - name: Home "today's changes" summary — no AI
        if: inputs.task == 'daily'
        run: python tools/feed_today.py
      - name: Reconcile 193 countries and 23 regions against registered source gaps (offline)
        if: inputs.task == 'sources'
        run: python tools/world_source_coverage_audit.py --root . --output review-evidence
      - name: Weekly source registry check
        if: inputs.task == 'sources'
        run: python tools/probe_sources.py data_branch/feeds/sources_registry.json
      # Time may pass while numerous public sources are collected. Remove ONLY
      # notices that have actually closed, then rebuild country/home counters.
      # This preserves original source timestamps and still uses the strict gate.
      - name: Reconcile tenders that closed during long collection
        if: inputs.task == 'daily'
        run: python tools/reconcile_expiring_tenders.py data_branch
      - name: Quality gate — must pass before anything is published
        if: inputs.task == 'daily'
        run: python tools/quality_gate.py data_branch
      - name: Publish to data branch
        id: publish_feeds
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          cd data_branch
          git config user.name "GOV RADAR bot"
          git config user.email "73036396@naver.com"
          # Both the six-agency daily snapshot and tenders must reach data/.
          # If the fast USGS updater wrote concurrently, merge by source freshness,
          # NOT by overwriting or discarding other agencies' data.
          git add feeds hz/official.json hz/hazards.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          collected_official="$(mktemp)"
          trap 'rm -f "$collected_official"' EXIT
          cp hz/official.json "$collected_official"
          git commit -m "Feed ${{ inputs.task }} $(date -u +%FT%H:%MZ)"
          generated_sha="$(git rev-parse HEAD)"
          for attempt in 1 2 3; do
            if git push origin HEAD:data; then
              echo "PUBLISHED_TO_DATA_BRANCH=YES"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then break; fi
            echo "Concurrent data update; merging source snapshots with the latest remote data"
            git fetch -q origin data
            git reset --hard origin/data
            git checkout "$generated_sha" -- feeds
            python ../tools/merge_official_sources.py hz/official.json "$collected_official"
            # Run the strict gate again against the NEW remote base before retrying.
            python ../tools/quality_gate.py .
            git add feeds hz/official.json hz/hazards.json
            if git diff --cached --quiet; then echo "already published"; exit 0; fi
            git commit -m "Feed ${{ inputs.task }} reconciled $(date -u +%FT%H:%MZ)"
          done
          echo "PUBLISH_FAILED after 3 attempts; no forced update" >&2
          exit 1
      # Checks run AFTER publishing so a flaky outside page cannot stop the daily update, but they are strict:
      # any mismatch, broken link, unreadable page or stale site feed marks this run FAILED (red) for follow-up.
      - name: Cross-check sample notices against official records (strict)
        if: inputs.task == 'daily'
        run: python tools/verify_samples.py 4
      - name: Check the public site reads fresh feeds (strict; stale = FAIL)
        if: inputs.task == 'daily' && always()
        run: python tools/check_site.py data_branch/feeds/site_check.json
      # Feed data is committed earlier. The post-publish report was left as a
      # local artifact only, leaving public site_check.json stuck at 2026-11-16.
      # Publish only current PASS/FAIL evidence; never force-push or overwrite
      # concurrently updated USGS/NWS/data snapshots.
      - name: Persist current site probe PASS or FAIL to data branch
        if: ${{ always() && inputs.task == 'daily' && !inputs.dry_run && steps.publish_feeds.outcome == 'success' }}
        run: python3 tools/publish_site_check.py data_branch
      - name: Summarize any optional collector failure without suppressing the publish evidence
        if: ${{ always() && inputs.task == 'daily' }}
        run: |
          python3 tools/optional_collector_health.py report \
            "$RUNNER_TEMP/wmm_optional_collectors.tsv" \
            "$RUNNER_TEMP/wmm_optional_collectors.json" \
            data_branch
      - name: Keep the outputs of this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feeds-${{ inputs.task }}-${{ github.run_id }}
          path: |
            data_branch/feeds/tenders.json
            data_branch/hz/official.json
            data_branch/feeds/sources_status.json
            data_branch/feeds/verify_samples.json
            data_branch/feeds/site_check.json
            data_branch/feeds/sources_registry.json
            review-evidence/world-source-coverage.json
            review-evidence/world-source-gap-queue.csv
            ${{ runner.temp }}/wmm_optional_collectors.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Fail closed if optional collectors failed or did not run
        if: ${{ always() && inputs.task == 'daily' }}
        run: python3 tools/optional_collector_health.py gate "$RUNNER_TEMP/wmm_optional_collectors.json"
