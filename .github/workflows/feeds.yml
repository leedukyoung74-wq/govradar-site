# Reusable feed job — the ONE place that defines how feeds are collected.
# Called by: main/.github/workflows/schedule.yml (daily 06:10 KST and weekly source check, once the owner approves it),
#            feeds-dryrun.yml in this branch (no publishing), and can be run by hand.
# dry_run=true runs every collector and the checks but never pushes to the data branch; outputs are kept as a run artifact.
name: Feeds (reusable)
on:
  workflow_call:
    inputs:
      task:     { type: string, default: daily }        # daily | sources
      code_ref: { type: string, default: src }          # branch or SHA whose collector code runs
      dry_run:  { type: boolean, default: false }
    secrets:
      DAPA_KEY: { required: false }
      SAM_KEY:  { required: false }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: { group: "feeds-${{ inputs.dry_run && 'dry' || 'live' }}", cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.code_ref }}" }
      - uses: actions/checkout@v4
        with: { ref: data, path: data_branch, fetch-depth: 50 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Offline tests first (stop before touching data if the code is broken)
        run: python -m unittest discover -s tests
      - name: Collect tenders (keys are optional; sources without a key are SKIPPED)
        if: inputs.task == 'daily'
        run: python tools/feed_tenders.py
        env: { DAPA_KEY: "${{ secrets.DAPA_KEY }}", SAM_KEY: "${{ secrets.SAM_KEY }}" }
      - if: inputs.task == 'daily'
        run: python tools/feed_intel.py || echo "intel feed failed; keeping yesterday's files"
      - if: inputs.task == 'daily'
        run: python tools/feed_cty.py || echo "country files failed"
      - name: Official situation feed (USGS, GDACS, NASA EONET, WHO, NASA JPL, NOAA) — no AI
        if: inputs.task == 'daily'
        run: python tools/feed_official.py || echo "official feed partly failed; failed agencies keep their last good items"
      - name: Country economy feed (World Bank indicators, exchange rates) — no AI
        if: inputs.task == 'daily'
        run: python tools/feed_econ.py || echo "economy feed failed; keeping the last good values"
      - name: Sanctions lists (UN, US OFAC, EU, UK) — no AI
        if: inputs.task == 'daily'
        run: python tools/feed_sanctions.py || echo "sanctions feed failed; keeping the last good numbers"
      - name: Home "today's changes" summary — no AI
        if: inputs.task == 'daily'
        run: python tools/feed_today.py
      - name: Weekly source registry check
        if: inputs.task == 'sources'
        run: python tools/probe_sources.py data_branch/feeds/sources_registry.json
      - name: Quality gate — must pass before anything is published
        if: inputs.task == 'daily'
        run: python tools/quality_gate.py data_branch
      - name: Publish to data branch
        if: ${{ !inputs.dry_run }}
        run: |
          cd data_branch
          git add feeds hz/official.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="GOV RADAR bot" -c user.email="73036396@naver.com" commit -m "Feed ${{ inputs.task }} $(date -u +%FT%H:%MZ)"
          # other jobs (situation summary, member data) also write to data: if one pushed meanwhile, replay on top of it.
          # A real conflict on the same file stops here instead of overwriting the other job's work.
          for i in 1 2 3; do
            git push origin HEAD:data && exit 0
            git fetch -q origin data && git -c user.name="GOV RADAR bot" -c user.email="73036396@naver.com" rebase origin/data || { git rebase --abort; echo "conflict with another data job"; exit 1; }
          done
          exit 1
      # Checks run AFTER publishing so a flaky outside page cannot stop the daily update, but they are strict:
      # any mismatch, broken link, unreadable page or stale site feed marks this run FAILED (red) for follow-up.
      - name: Cross-check sample notices against official records (strict)
        if: inputs.task == 'daily'
        run: python tools/verify_samples.py 4
      - name: Check the public site reads fresh feeds (strict; stale = FAIL)
        if: inputs.task == 'daily' && always()
        run: python tools/check_site.py data_branch/feeds/site_check.json
      - name: Keep the outputs of this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feeds-${{ inputs.task }}-${{ github.run_id }}
          path: |
            data_branch/feeds/tenders.json
            data_branch/hz/official.json
            data_branch/feeds/sources_status.json
            data_branch/feeds/verify_samples.json
            data_branch/feeds/site_check.json
            data_branch/feeds/sources_registry.json
          if-no-files-found: ignore
          retention-days: 30
