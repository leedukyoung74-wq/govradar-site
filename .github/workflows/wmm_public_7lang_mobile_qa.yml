name: GOV RADAR public 7-language mobile read-only QA (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'ops/qa_public_7lang_mobile.py'
      - '.github/workflows/wmm_public_7lang_mobile_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Live public GET-only desktop/mobile tests
        run: python ops/qa_public_7lang_mobile.py
      - name: Evidence artifacts without user data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wmm-7-language-mobile-readonly
          path: public-browser-evidence/
          retention-days: 3
          if-no-files-found: warn
