# Owner-only, no external API requests, no provider key values logged.
name: WMM KONEPS private key shape classification (OFFLINE)
on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/wmm_koneps_secret_shape_owner.yml
      - ops/wmm_koneps_secret_shape_offline.py
      - ops/tests/test_wmm_koneps_secret_shape_offline.py
permissions:
  contents: read
jobs:
  offline_review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline format and secret-redaction tests
        run: python3 -m unittest discover -s ops/tests -p 'test_wmm_koneps_secret_shape_offline.py' -v
  private_offline_format_check:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 80 &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == 'leedukyoung74-wq' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/govradar-check-koneps-keyformat'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify fail-closed and redaction rules offline
        run: python3 -m unittest discover -s ops/tests -p 'test_wmm_koneps_secret_shape_offline.py' -v
      - name: Classify stored KONEPS key shape without API requests or secrets in output
        env:
          KONEPS_KEY: ${{ secrets.KONEPS_KEY }}
        run: python3 ops/wmm_koneps_secret_shape_offline.py
      - name: Explain limits without touching the key
        if: always()
        run: |
          echo "Offline only: API calls=0, tender publications=0." >> "$GITHUB_STEP_SUMMARY"
          echo "The result cannot establish official dataset approval or key validity." >> "$GITHUB_STEP_SUMMARY"
