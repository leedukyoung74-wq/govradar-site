name: WMM Unified Auth Consent and Google Return QA (No Deploy)
on:
  pull_request:
    branches: [src]
    paths:
      - 'web/auth.js'
      - 'tests/test_auth_marketing_consent.test.cjs'
      - 'tests/test_auth_oauth_return.test.cjs'
      - 'tests/test_auth_membership_tiers.test.cjs'
      - '.github/workflows/wmm_auth_unified_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check web/auth.js
      - name: Run consent and OAuth mock tests against same merged file (no network)
        run: node --test tests/test_auth_marketing_consent.test.cjs tests/test_auth_oauth_return.test.cjs tests/test_auth_membership_tiers.test.cjs
