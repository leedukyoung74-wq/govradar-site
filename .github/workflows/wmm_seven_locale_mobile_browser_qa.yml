name: WMM Seven-language real mobile browser QA (GET-only, NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/wmm_public_seven_locale_browser_qa.py'
      - 'ops/tests/test_wmm_public_seven_locale_browser_qa.py'
      - '.github/workflows/wmm_seven_locale_mobile_browser_qa.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/wmm_seven_locale_mobile_browser_qa.yml'
      - 'ops/wmm_public_seven_locale_browser_qa.py'
      - 'ops/tests/test_wmm_public_seven_locale_browser_qa.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline_review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic mobile/RTL/POST-block checks, NO NETWORK
        run: python3 -m unittest discover -s ops/tests -p 'test_wmm_public_seven_locale_browser_qa.py' -v
      - name: PR does not touch public website or customer records
        run: echo 'NO LIVE BROWSER IN PR, NO POST, NO PAYMENT, NO DEPLOY'
  browser:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate browser privacy and source invariants first
        run: python3 -m unittest discover -s ops/tests -p 'test_wmm_public_seven_locale_browser_qa.py' -v
      - name: Install ephemeral public-only Chromium
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Inspect seven mobile homepages plus KO/EN desktop, GET only
        run: python3 ops/wmm_public_seven_locale_browser_qa.py
      - name: Save short-lived public-page screenshots for owner inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wmm-7-locale-public-mobile-${{ github.run_id }}
          path: qa-artifacts/*.png
          retention-days: 3
          if-no-files-found: ignore
