# Read-only SAM.gov API smoke test; intentionally no publishing or credential output.
name: WMM SAM.gov API one-request verification (NO PUBLISH)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: One official SAM.gov public opportunities request
        env:
          SAM_KEY: ${{ secrets.SAM_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          key = os.getenv("SAM_KEY", "").strip()
          if not key:
              print("SAM_AUTH_STATUS=SECRET_NOT_CONFIGURED")
              sys.exit(1)
          print("SAM_AUTH_STATUS=SECRET_PRESENT_VALUE_HIDDEN")
          today = dt.datetime.now(dt.timezone.utc).date()
          query = urllib.parse.urlencode({
              "api_key": key,
              "postedFrom": (today-dt.timedelta(days=14)).strftime("%m/%d/%Y"),
              "postedTo": today.strftime("%m/%d/%Y"),
              "limit": 1,
              "offset": 0,
              "ptype": "o",
          })
          # Query string includes secret: never print request URL or exception details.
          url = "https://api.sam.gov/opportunities/v2/search?" + query
          try:
              req = urllib.request.Request(url,headers={"User-Agent":"WMM-GOV-RADAR-SAM-readonly-check/1.0"})
              with urllib.request.urlopen(req,timeout=25) as res:
                  code = res.status
                  body = res.read(150000)
          except urllib.error.HTTPError as e:
              print("SAM_HTTP_STATUS="+str(e.code))
              print("SAM_CHECK=HTTP_ERROR")
              sys.exit(1)
          except Exception:
              print("SAM_CHECK=NETWORK_OR_REQUEST_ERROR")
              sys.exit(1)
          print("SAM_HTTP_STATUS="+str(code))
          try:
              data = json.loads(body)
          except Exception:
              print("SAM_CHECK=NON_JSON_RESPONSE")
              sys.exit(1)
          if not isinstance(data,dict):
              print("SAM_CHECK=UNEXPECTED_JSON_SHAPE")
              sys.exit(1)
          if "opportunitiesData" not in data or not isinstance(data["opportunitiesData"],list):
              print("SAM_CHECK=MISSING_OPPORTUNITIES_DATA")
              sys.exit(1)
          print("SAM_TOTAL_RECORDS="+str(data.get("totalRecords","UNSPECIFIED")))
          print("SAM_ITEM_COUNT_IN_TEST_PAGE="+str(len(data["opportunitiesData"])))
          print("SAM_CHECK=REACHABLE_JSON")
          print("NOTE: One small test request only; no data published, source freshness not verified.")
          PY
