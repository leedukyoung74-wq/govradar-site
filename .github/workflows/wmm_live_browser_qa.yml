name: WMM GOV RADAR real-browser KO EN mobile smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/wmm_live_browser_qa.yml
permissions:
  contents: read
jobs:
  browser_qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Set up Python and Chromium browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Read-only public browser checks
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p qa-artifacts
          python - <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright
          checks = [
              ('KO cyber desktop','https://radar.wmm-hoa.com/cyber/?stay=1',1366,800),
              ('KO cyber mobile','https://radar.wmm-hoa.com/cyber/?stay=1',390,844),
              ('EN cyber mobile','https://radar.wmm-hoa.com/cyber/en/?stay=1',390,844),
              ('Hazards mobile','https://radar.wmm-hoa.com/hazards/?stay=1',390,844),
          ]
          async def main():
            failures=[]
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=['--no-sandbox'])
              for label,url,width,height in checks:
                ctx=await browser.new_context(viewport={'width':width,'height':height},device_scale_factor=1)
                page=await ctx.new_page()
                failed=[]
                try:
                  res=await page.goto(url,wait_until='domcontentloaded',timeout=50000)
                  if res is None or res.status!=200:
                    failed.append('html_not_200')
                  panel=page.locator('#wmm-official-sources')
                  await panel.wait_for(state='visible',timeout=25000)
                  await page.wait_for_function("""() => {
                    const x=[...document.querySelectorAll('#wmm-official-sources .wmm-of-status')];
                    return x.length === 2 && x.every(y => !/Loading official source data|공식 자료를 불러오는 중/.test(y.textContent));
                  }""",timeout=25000)
                  statuses=await page.locator('#wmm-official-sources .wmm-of-status').all_text_contents()
                  rows=await page.locator('#wmm-official-sources .wmm-of-item').count()
                  dims=await page.evaluate("""() => ({width: innerWidth, doc: document.documentElement.scrollWidth, path: location.pathname})""")
                  if dims['doc']>dims['width']+16:
                    failed.append('horizontal_overflow_'+str(dims['doc']-dims['width']))
                  if any('연결에 실패' in x or 'Source unavailable' in x or '정보원 확인 불가' in x for x in statuses):
                    failed.append('source_status_unavailable')
                  if rows<1:
                    failed.append('official_panels_have_no_rows')
                  await panel.scroll_into_view_if_needed(timeout=10000)
                  await page.screenshot(path='qa-artifacts/'+label.replace(' ','_')+'.png',full_page=False)
                  print(json.dumps({'check':label,'url':page.url,'status':res.status if res else None,'width':width,'rows':rows,'source_status':statuses,'dimensions':dims,'issues':failed},ensure_ascii=False))
                except Exception as e:
                  failed.append(type(e).__name__+':'+str(e)[:180])
                  print(json.dumps({'check':label,'url':page.url,'issues':failed},ensure_ascii=False))
                if failed: failures.append((label,failed))
                await ctx.close()
              await browser.close()
            print(json.dumps({'total':len(checks),'failed':len(failures),'failures':failures},ensure_ascii=False))
            if failures: raise SystemExit(1)
          asyncio.run(main())
          PY
      - name: Attach public page screenshots for owner review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wmm-public-browser-qa-${{ github.run_id }}
          path: qa-artifacts/*.png
          retention-days: 3
          if-no-files-found: ignore
