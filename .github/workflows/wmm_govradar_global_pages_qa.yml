name: GOV RADAR 1512 global pages QA (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'build.py'
      - 'tools/regions_20261114.py'
      - 'src/regions.json'
      - 'src/countries_meta.json'
      - 'tests/test_special_regions_coverage.py'
      - '.github/workflows/wmm_govradar_global_pages_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full_language_map:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test 193 countries 23 parent-linked regions BARMM sources
        run: python -m unittest discover -s tests -p 'test_special_regions_coverage.py' -v
      - name: Build isolated preview and never publish
        run: python build.py --base https://preview.invalid
      - name: Verify 1512 localized country and territory routes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          dist=Path('dist')
          countries=json.loads((dist/'data/countries.json').read_text(encoding='utf-8'))
          regions=json.loads((dist/'data/regions.json').read_text(encoding='utf-8'))
          langs=('ko','en','es','fr','ar','vi','id')
          assert len(countries)==193,len(countries)
          assert len(regions)==23,len(regions)
          rows=[(x['iso'], x['slug']) for x in countries]+[(x['code'],x['slug']) for x in regions]
          assert len({x[0] for x in rows})==216,'duplicate region or country code'
          assert len({x[1] for x in rows})==216,'duplicate slug paths'
          checked=0
          for lang in langs:
              for code,slug in rows:
                  path=dist/lang/slug/'index.html'
                  assert path.is_file(),(lang,code,'missing page',str(path))
                  html=path.read_text(encoding='utf-8')
                  assert '<html' in html and '<title' in html and '</html>' in html,(lang,code,'invalid page')
                  assert f'/{lang}/' in html,(lang,code,'missing language-specific navigation')
                  checked+=1
          assert checked==1512,checked
          barmm=next(x for x in regions if x['code']=='PH-BARMM')
          en=(dist/'en'/barmm['slug']/'index.html').read_text(encoding='utf-8')
          ko=(dist/'ko'/barmm['slug']/'index.html').read_text(encoding='utf-8')
          assert 'Macacua' in en and 'bangsamoro.gov.ph' in en,'BARMM sources missing from English HTML'
          assert '마카쿠아' in ko,'BARMM source-backed Korean profile missing'
          assert 'https://preview.invalid/en/' in en,'preview hostname missing from canonical HTML'
          site=(dist/'sitemap.xml').read_text(encoding='utf-8')
          assert barmm['slug'] in site,'BARMM route missing from sitemap'
          print(f'PASS: {checked} localized routes, 193 countries, 23 regions, BARMM primary sources, NO DEPLOY')
          PY
      - name: Review-only completion notice
        run: echo 'No data or production branch modified'
