name: WMM Tender Disclosure Source QA (Review Only)
on:
  pull_request:
    branches: [src]
    paths:
      - 'build.py'
      - 'pages3.py'
      - 'tests/test_tender_disclosure_source.py'
      - 'tests/test_tender_disclosure_generated.py'
      - 'tests/fixtures/create_tender_fixture.py'
      - '.github/workflows/wmm_tender_disclosure_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax without importing production modules
        run: python -m py_compile build.py pages3.py
      - name: Assert tender claim and expiry safety
        run: python -m unittest discover -s tests -p 'test_tender_disclosure_source.py' -v
  generated-mdb-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inject synthetic tender fixtures (offline, QA-only)
        run: python tests/fixtures/create_tender_fixture.py
      - name: Build local static preview only (not deployed)
        run: python build.py --base https://radar.wmm-hoa.com
      - name: Check rendered tender disclosure in seven languages
        env:
          WMM_GENERATED_QA: '1'
        run: python -m unittest discover -s tests -p 'test_tender_disclosure_generated.py' -v
