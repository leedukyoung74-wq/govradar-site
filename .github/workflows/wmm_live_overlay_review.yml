name: WMM live/public selective overlay audit (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'tools/stage_live_overlay.py'
      - 'tests/test_live_overlay.py'
      - '.github/workflows/wmm_live_overlay_review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout canonical generator from PR
        uses: actions/checkout@v4
      - name: Read-only checkout of current production live branch
        uses: actions/checkout@v4
        with:
          ref: live
          path: live-snapshot
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test overlay source preservation and no-deploy contract
        run: python -m unittest discover -s tests -p 'test_live_overlay.py' -v
      - name: Build complete canonical site (no publication)
        run: python build.py --base https://radar.wmm-hoa.com
      - name: Apply existing Cloudflare compatibility variant (review only)
        run: python tools/cf_variant.py dist cf/public
      - name: Stage allowlisted 18 files over untouched production snapshot
        run: |
          python tools/stage_live_overlay.py --generated cf/public --live live-snapshot/public --out live-preview/public
      - name: Verify production Cloudflare Functions remain unchanged and overlay stays scoped
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          live=root/'live-snapshot'
          staged=root/'live-preview/public'
          report=json.loads((root/'live-preview/live-overlay-review-manifest.json').read_text())
          assert len(report['file_changes'])==18
          assert report['deployable'] is False
          assert report['publication_performed'] is False
          assert report['verified_country_products']==0
          assert not (staged/'quality/index.html').exists()
          assert not (staged/'review/index.html').exists()
          for rel in ['_routes.json','_headers','_redirects','assets/auth.js','assets/site.js','ko/index.html','en/index.html','data/countries.json','data/regions.json']:
            assert (staged/rel).read_bytes()==(live/'public'/rel).read_bytes(),rel
          for path in (live/'functions').rglob('*'):
            if path.is_file():
              assert path.read_bytes()==(live/'functions'/path.relative_to(live/'functions')).read_bytes()
          print('PASS: 18 allowlisted files, live core and functions preserved; NO publish.')
          PY
      - name: Install browser testing tools in ephemeral runner
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Serve selective live preview on localhost only
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory live-preview/public > /tmp/wmm-live-overlay-audit.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/ko/resilience/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Test seven-language 21-case Chromium interaction in live overlay
        run: node tests/wmm_resilience_generated_browser_review.cjs
      - name: Save audit manifest and Chromium screenshots (NOT deploy artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wmm-live-overlay-audit-ONLY
          path: |
            live-preview/live-overlay-review-manifest.json
            browser-review/
          retention-days: 5
          if-no-files-found: warn
