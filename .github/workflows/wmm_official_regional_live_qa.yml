name: WMM official England flood and Japan JMA real-feed pilot (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'tools/official_regional_feeds.py'
      - 'tests/test_official_regional_feeds.py'
      - '.github/workflows/wmm_official_regional_live_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe_official_live_connectivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify parsers deny untrusted inputs and stale sources
        run: |
          python -m unittest discover -s tests -p 'test_official_regional_feeds.py' -v
          python -m unittest discover -s tests -p 'test_world_source_gap_audit.py' -v
      - name: One read-only GET of each official public API (no third-party hosting)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/wmm-regional-internal"
          python tools/official_regional_feeds.py --out "$RUNNER_TEMP/wmm-regional-internal/report.json"
      - name: Keep ephemeral data out of code, public website and logs
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/wmm-regional-internal"
          echo "No customer data, no paid APIs, no public alert publication, no repository write, no user notifications."
