name: WMM GOV RADAR Form Relay P0 QA (No Deploy)
on:
  pull_request:
    branches: [src]
    paths:
      - 'cf/functions/nfform.js'
      - 'scripts/wmm_form_routes_audit.mjs'
      - 'tests/wmm_form_relay.test.mjs'
      - 'tests/wmm_form_routes_audit.test.mjs'
      - 'tests/wmm_form_live_contract.test.mjs'
      - '.github/workflows/wmm_form_relay_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  form-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate Form Pages Function and static auditor syntax
        run: |
          node --check cf/functions/nfform.js
          node --check scripts/wmm_form_routes_audit.mjs
      - name: Test safe relaying and localized form routing (no live submissions)
        run: node --test tests/wmm_form_relay.test.mjs tests/wmm_form_routes_audit.test.mjs
      - name: Checkout existing live files for read-only generated-form audit
        uses: actions/checkout@v7
        with:
          ref: live
          path: live-branch
          persist-credentials: false
      - name: Validate already-generated production form route definitions
        run: |
          test -f live-branch/functions/nfform.js
          node scripts/wmm_form_routes_audit.mjs live-branch/public
          node --test tests/wmm_form_live_contract.test.mjs
          echo "Verified static form destinations and allowed registered form names; NOT form submission delivery."
