name: WMM GOV RADAR production deployment smoke check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/wmm_live_smoke.yml

permissions:
  contents: read

jobs:
  public_site_check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check published site and data endpoints without changing production
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, sys, datetime
          base='https://radar.wmm-hoa.com'
          data='https://raw.githubusercontent.com/leedukyoung74-wq/govradar-site/data/hz/'
          checks=[
            ('KO cyber',base+'/cyber/?stay=1','wmm-official-sources.js'),
            ('EN cyber',base+'/cyber/en/?stay=1','wmm-official-sources.js'),
            ('Global hazards',base+'/hazards/?stay=1','wmm-official-sources.js'),
            ('New production script',base+'/assets/wmm-official-sources.js?v=20261119a','cisa_kev.json'),
            ('USGS official feed',data+'official.json','"sources"'),
            ('NWS official feed',data+'nws_active.json','"source_health"'),
            ('CISA KEV official feed',data+'cisa_kev.json','"source_health"'),
          ]
          report=[]
          for name,url,needle in checks:
            item={'check':name,'expected_text':needle,'url':url}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; WMM-GOV-RADAR-Owner-Public-Deployment-Smoke/1.0)'})
              with urllib.request.urlopen(req,timeout=25) as res:
                content=res.read(350000).decode('utf-8','replace')
                item['status']=res.status
                item['content_type']=res.headers.get('Content-Type','').split(';')[0]
                item['body_size_read']=len(content)
                item['present']=needle in content
                item['ok']=res.status==200 and item['present']
            except urllib.error.HTTPError as e:
              item.update(status=e.code,ok=False,error='HTTPError')
            except Exception as e:
              item.update(status=None,ok=False,error=type(e).__name__)
            report.append(item)
            print(json.dumps(item,ensure_ascii=False))
          print('Production smoke summary: '+str(sum(x['ok'] for x in report))+'/'+str(len(report))+' pass')
          if any(not x['ok'] for x in report):
            print('NOT VERIFIED: Production UI or source content is missing/inaccessible from GitHub runner.')
            sys.exit(1)
          print('PASS: Production HTML references the new panel JS; production JS and the three public datasets all serve over HTTPS.')
          PY
