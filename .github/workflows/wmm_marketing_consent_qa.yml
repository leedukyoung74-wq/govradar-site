name: WMM Marketing Consent Source QA (No Deploy)
on:
  pull_request:
    branches: [src]
    paths:
      - 'web/auth.js'
      - 'tests/test_auth_marketing_consent.test.cjs'
      - '.github/workflows/wmm_marketing_consent_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate auth script syntax
        run: node --check web/auth.js
      - name: Simulate marketing opt-in and opt-out with mocked Identity API
        run: node --test tests/test_auth_marketing_consent.test.cjs
