# Runs the daily feed when collector code changes on src, or by hand. The daily TIMER cannot live here: GitHub only runs
# `schedule` from the default branch (main) — see ops/main-branch/schedule.yml.
name: Daily tender feed (no AI)
on:
  workflow_dispatch:
  # Review/code merges must NOT cause unplanned production API bursts.
  # Production refresh is dispatched only from main/.github/workflows/schedule.yml.
  # Manual invocation remains available for owner-approved recovery.
permissions:
  contents: write
jobs:
  feed:
    uses: ./.github/workflows/feeds.yml
    with: { task: daily, code_ref: src, dry_run: false }
    secrets: { DAPA_KEY: "${{ secrets.DAPA_KEY }}", SAM_KEY: "${{ secrets.SAM_KEY }}" }
