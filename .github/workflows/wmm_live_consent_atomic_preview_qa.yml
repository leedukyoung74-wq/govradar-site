name: WMM GOV RADAR live request consent atomic preview QA (NO DEPLOY)
on:
  push:
    branches: [wmm-live-consent-atomic-preview-20261127]
    paths:
      - 'functions/api/req.js'
      - 'public/ko/request/index.html'
      - 'public/en/request/index.html'
      - 'public/ar/request/index.html'
      - '.github/workflows/wmm_live_consent_atomic_preview_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consent_bundle_qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: preview
      - uses: actions/checkout@v4
        with:
          ref: live
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: src
          path: source_tests
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify only the intended production deltas and exact form consent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          pre=Path("preview"); old=Path("baseline")
          api=(pre/"functions/api/req.js").read_text()
          assert 'b.privacy_consent !== true' in api
          assert 'body.length > 4000' in api
          assert api.index('b.privacy_consent !== true') < api.index('const key = u ?')
          assert 'export async function onRequestGet' in api
          assert 'export async function onRequestPost' in api
          assert 'export async function onRequestPatch' in api
          assert (pre/"functions/api/req.js").read_bytes()!=(old/"functions/api/req.js").read_bytes()
          for lang in ("ko","en","ar"):
              path=f"public/{lang}/request/index.html"
              new=(pre/path).read_text(); before=(old/path).read_text()
              assert 'name="privacy_agree" value="yes" required' in new,lang
              assert 'privacy_consent:f.querySelector(' in new,lang
              assert 'if(!ok||!f.querySelector(' in new,lang
              assert new.count('privacy_consent:f.querySelector(')==1,lang
              assert 'method="POST"' in new and '/api/req' in new,lang
              assert (len(new)-len(before))==128,(lang,len(new)-len(before))
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',new,re.S)
              for script in scripts:
                  with tempfile.NamedTemporaryFile(mode="w",suffix=".js",encoding="utf-8") as f:
                      f.write(script);f.flush()
                      p=subprocess.run(["node","--check",f.name],capture_output=True,text=True)
                      assert p.returncode==0, (lang,p.stderr)
              print("PASS ACTIVE FORM",lang)
          for lang in ("es","fr","vi","id"):
              path=f"public/{lang}/request/index.html"
              a=(pre/path).read_bytes(); b=(old/path).read_bytes()
              assert a==b and b"refresh" in a,lang
          for name in ("_routes.json","_headers","_redirects"):
              assert (pre/"public"/name).read_bytes()==(old/"public"/name).read_bytes(),name
          print("PASS: exactly three active forms and auth handler patched; four redirects and routing preserved")
          PY
      - name: Server integration tests using preview's exact deployed function (offline only)
        shell: bash
        run: |
          set -euo pipefail
          cp preview/functions/api/req.js source_tests/cf/functions/api/req.js
          cd source_tests
          node --check cf/functions/api/req.js
          node --experimental-sqlite tests/js/req_server_test.mjs
          python3 -m unittest discover -s tests -p 'test_req_server.py' -v
      - name: Confirm only four production files differ from existing live branch
        shell: bash
        run: |
          set -euo pipefail
          git -C preview fetch origin live --depth=1
          git -C preview diff --name-only origin/live..HEAD > /tmp/wmm_changed_files
          cat /tmp/wmm_changed_files
          python3 - <<'PY'
          from pathlib import Path
          files=set(Path("/tmp/wmm_changed_files").read_text().splitlines())
          expected={"functions/api/req.js","public/ko/request/index.html","public/en/request/index.html","public/ar/request/index.html",".github/workflows/wmm_live_consent_atomic_preview_qa.yml"}
          assert files==expected,(files,expected)
          print("PASS: production diff limited to consent bundle + preview-only CI workflow")
          PY
      - name: No publish
        if: always()
        run: echo 'NO live deployment; offline tests only; no forms submitted or customer records read.' >> "$GITHUB_STEP_SUMMARY"
