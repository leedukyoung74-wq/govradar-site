name: WMM Public Healthcheck & Sitemap Tests (No Deploy)
on:
  pull_request:
    paths:
      - 'scripts/wmm_public_healthcheck.mjs'
      - 'tests/wmm_public_healthcheck.test.mjs'
      - 'tests/wmm_sitemap.test.mjs'
      - 'tests/wmm_headers.test.mjs'
      - 'scripts/wmm_data_quality_audit.mjs'
      - 'tests/wmm_data_quality_audit.test.mjs'
      - 'data/countries.json'
      - 'data/regions.json'
      - 'data/opps.json'
      - '_headers'
      - 'scripts/wmm_sitemap_preview.mjs'
      - 'tests/wmm_sitemap_preview.test.mjs'
      - 'sitemap.xml'
      - '.github/workflows/wmm_public_healthcheck_unit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run offline unit tests and source route inventory (no network)
        run: node --test tests/wmm_public_healthcheck.test.mjs tests/wmm_sitemap.test.mjs tests/wmm_headers.test.mjs tests/wmm_data_quality_audit.test.mjs tests/wmm_sitemap_preview.test.mjs
      - name: Build review-only source-derived sitemap
        run: |
          node scripts/wmm_sitemap_preview.mjs --output "$RUNNER_TEMP/wmm-sitemap-preview.xml" --json > "$RUNNER_TEMP/wmm-sitemap-preview-summary.json"
          cat "$RUNNER_TEMP/wmm-sitemap-preview-summary.json"
      - name: Save preview artifact only (not public deployment)
        uses: actions/upload-artifact@v4
        with:
          name: wmm-sitemap-preview
          path: |
            ${{ runner.temp }}/wmm-sitemap-preview.xml
            ${{ runner.temp }}/wmm-sitemap-preview-summary.json
          retention-days: 3
