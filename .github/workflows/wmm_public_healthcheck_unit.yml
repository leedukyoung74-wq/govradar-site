name: WMM Public Healthcheck & Sitemap Tests (No Deploy)
on:
  pull_request:
    paths:
      - 'scripts/wmm_public_healthcheck.mjs'
      - 'tests/wmm_public_healthcheck.test.mjs'
      - 'tests/wmm_sitemap.test.mjs'
      - 'sitemap.xml'
      - '.github/workflows/wmm_public_healthcheck_unit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run offline unit and sitemap-source tests (no network)
        run: node --test tests/wmm_public_healthcheck.test.mjs tests/wmm_sitemap.test.mjs
