name: GOV RADAR integrated source customer truth QA (NO DEPLOY)
on:
  pull_request:
    branches: [src]
    paths:
      - 'build.py'
      - 'pages2.py'
      - 'pages3.py'
      - 'src/customer_receipts.json'
      - 'src/customer-support.html'
      - 'cf/functions/nfform.js'
      - 'tests/source-nfform-method-gate.test.cjs'
      - 'tests/test_customer_receipt_truth.py'
      - 'tests/customer-support.test.cjs'
      - 'tests/customer-public-route-gate.test.cjs'
      - '.github/workflows/wmm_customer_source_truth_qa.yml'
permissions:
  contents: read
jobs:
  generator_customer_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python syntax and two kinds of generated receipt pages across seven locales
        run: |
          python3 -m py_compile build.py pages2.py pages3.py
          python3 -m unittest discover -s tests -p 'test_customer_receipt_truth.py' -v
      - name: Rebuild-safe form relay GET HEAD privacy and upstream mock tests
        run: node --test tests/source-nfform-method-gate.test.cjs
      - name: Shared first-time visitor and local-only FAQ checks
        run: |
          node tests/customer-public-route-gate.test.cjs
          node tests/customer-support.test.cjs
      - name: No prod deployment or external customer traffic
        run: echo 'SOURCE QA ONLY — no POST, customer data, payment, paid API or publish'
