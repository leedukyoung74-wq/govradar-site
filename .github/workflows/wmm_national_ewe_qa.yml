name: GOV RADAR 193-country climate weather emergency QA (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'src/environment_weather_emergency_sites.json'
      - 'tools/environment_weather_emergency_sites.py'
      - 'tests/test_environment_weather_emergency_sites.py'
      - 'build.py'
      - '.github/workflows/wmm_national_ewe_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  country-agencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check 193 countries and fail-closed official agency candidates
        run: |
          python -m py_compile build.py tools/environment_weather_emergency_sites.py
          python -m unittest discover -s tests -p 'test_environment_weather_emergency_sites.py' -v
          python -m unittest discover -s tests -p 'test_government_business_sites.py' -v
