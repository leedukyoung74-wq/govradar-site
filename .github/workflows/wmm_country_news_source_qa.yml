name: GOV RADAR sovereign national news publisher coverage QA (NO DEPLOY)
on:
  pull_request:
    paths:
      - "src/country_news_sources.json"
      - "tools/country_news_sources.py"
      - "tests/test_country_news_sources.py"
      - "build.py"
      - ".github/workflows/wmm_country_news_source_qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  national-media-source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check country journalism source schema, coverage and HTML build syntax
        run: |
          python -m unittest discover -s tests -p 'test_country_news_sources.py' -v
          python -m py_compile build.py tools/country_news_sources.py
