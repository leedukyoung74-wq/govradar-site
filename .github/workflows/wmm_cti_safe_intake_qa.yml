name: WMM CTI source intake QA (NO PUBLICATION)
on:
  pull_request:
    paths:
      - 'tools/cti_safe_intake.py'
      - 'tests/test_cti_safe_intake.py'
      - '.github/workflows/wmm_cti_safe_intake_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  defensive-cti-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate synthetic safe intake and release gates
        run: python -m unittest discover -s tests -p 'test_cti_safe_intake.py' -v
      - name: Pull CISA official mirror for INTERNAL validation ONLY
        run: |
          mkdir -p /tmp/wmm-cti-audit
          python tools/cti_safe_intake.py --out /tmp/wmm-cti-audit/kev-internal.json
      - name: Verify metadata and show NO victim, vendor or public-release claims
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/wmm-cti-audit/kev-internal.json',encoding='utf8'))
          assert p['source_entries']>=1
          assert p['deployable'] is False and p['public_release_allowed'] is False
          assert p['cti_vendor_connected'] is False
          assert all(not x['victim_or_outage_confirmed'] for x in p['records'])
          print('CTI read-only sample validation PASS; entries:',p['source_entries'])
          print('Source SHA256:',p['source_sha256'])
          print('NO public feed upload, NO provider secret, NO user PII, NO darknet connection')
          PY
      - name: Ensure unpublished internal data is deleted at runner shutdown
        if: always()
        run: rm -rf /tmp/wmm-cti-audit
