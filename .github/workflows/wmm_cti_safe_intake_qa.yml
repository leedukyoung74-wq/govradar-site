name: WMM CTI source intake QA (NO PUBLICATION)
on:
  pull_request:
    paths:
      - 'tools/cti_safe_intake.py'
      - 'tests/test_cti_safe_intake.py'
      - 'tools/cti_internal_review.py'
      - 'tests/test_cti_internal_review.py'
      - 'tools/cti_asset_match.py'
      - 'tests/test_cti_asset_match.py'
      - 'tools/cti_epss_offline.py'
      - 'tests/test_cti_epss_offline.py'
      - 'tools/cti_provider_audit.py'
      - 'tests/test_cti_provider_audit.py'
      - 'ops/cti_provider_registry.json'
      - '.github/workflows/wmm_cti_safe_intake_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  defensive-cti-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate synthetic safe intake and release gates
        run: python -m unittest discover -s tests -p 'test_cti_safe_intake.py' -v
      - name: Test internal CTI triage freshness and legal gates
        run: python -m unittest discover -s tests -p 'test_cti_internal_review.py' -v
      - name: Test approved inventory candidate-only matching (no scanning)
        run: python -m unittest discover -s tests -p 'test_cti_asset_match.py' -v
      - name: Validate free offline EPSS enrichment with synthetic data (no HTTP)
        run: python -m unittest discover -s tests -p 'test_cti_epss_offline.py' -v
      - name: Assert nine CTI providers stay disabled without license and authorization
        run: |
          python -m unittest discover -s tests -p 'test_cti_provider_audit.py' -v
          python tools/cti_provider_audit.py
      - name: Pull CISA official mirror for INTERNAL validation ONLY
        run: |
          mkdir -p /tmp/wmm-cti-audit
          python tools/cti_safe_intake.py --out /tmp/wmm-cti-audit/kev-internal.json
      - name: Verify metadata and show NO victim, vendor or public-release claims
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/wmm-cti-audit/kev-internal.json',encoding='utf8'))
          assert p['source_entries']>=1
          assert p['deployable'] is False and p['public_release_allowed'] is False
          assert p['cti_vendor_connected'] is False
          assert all(not x['victim_or_outage_confirmed'] for x in p['records'])
          print('CTI read-only sample validation PASS; entries:',p['source_entries'])
          print('Source SHA256:',p['source_sha256'])
          print('NO public feed upload, NO provider secret, NO user PII, NO darknet connection')
          PY
      - name: Produce only private short-lived CTI brief and validate release block
        run: |
          python tools/cti_internal_review.py --input /tmp/wmm-cti-audit/kev-internal.json --out /tmp/wmm-cti-audit/kev-private-review.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/wmm-cti-audit/kev-private-review.json'))
          assert d['public_release_allowed'] is False
          assert d['provider_darkweb_connected'] is False
          assert d['confirmed_customer_breaches'] == 0
          assert d['freshness'] == 'REVIEW_REQUIRED'
          assert 1 <= d['recent_30d_entries'] <= d['source_entries']
          print("PASS: private, non-publication review with freshness guard")
          PY
      - name: Test FIRST's real daily EPSS CSV with CISA KEV, ephemeral and INTERNAL ONLY
        shell: bash
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 1 --max-time 120 --max-filesize 60000000 \
            'https://epss.empiricalsecurity.com/epss_scores-current.csv.gz' \
            --output /tmp/wmm-cti-audit/epss-current.csv.gz
          python tools/cti_epss_offline.py \
            --kev /tmp/wmm-cti-audit/kev-internal.json \
            --epss /tmp/wmm-cti-audit/epss-current.csv.gz \
            --out /tmp/wmm-cti-audit/epss-private-review.json
          python - <<'PY'
          import json
          report=json.load(open('/tmp/wmm-cti-audit/epss-private-review.json',encoding='utf8'))
          assert report['public_release_allowed'] is False
          assert report['darkweb_vendor_connected'] is False
          assert report['customer_breaches_confirmed'] is False
          assert report['customer_data_processed'] is False
          assert report['source_kev_entries']>0
          assert report['matched_count']>0
          print('FIRST+KEV REAL-FEED EPHEMERAL VALIDATION PASS; matching CVEs:',report['matched_count'],
                'missing score count:',report['missing_score_count'],'EPSS date:',report['epss_score_date'])
          print('NO customer data, NO darkweb vendors, NO publication, NO stored artifacts.')
          PY
      - name: Ensure unpublished internal data is deleted at runner shutdown
        if: always()
        run: rm -rf /tmp/wmm-cti-audit
