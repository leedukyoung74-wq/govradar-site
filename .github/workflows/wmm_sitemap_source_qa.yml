name: WMM Cloudflare Sitemap Source QA (No Deploy)
on:
  pull_request:
    branches: [src]
    paths:
      - 'tools/finalize_sitemap.py'
      - 'tools/publish_cf.sh'
      - 'tests/test_finalize_sitemap.py'
      - '.github/workflows/wmm_sitemap_source_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python3 -m py_compile tools/finalize_sitemap.py
      - name: Run offline fail-closed tests
        run: python3 -m unittest discover -s tests -p 'test_finalize_sitemap.py' -v
      - name: Check shell syntax without publishing
        run: bash -n tools/publish_cf.sh
