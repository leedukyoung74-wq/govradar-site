# One-time OWNER explicit permission; no scheduled calls or data publication.
name: WMM KONEPS one GET with whitespace-only key normalization (READ ONLY)
on:
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/wmm_koneps_whitespace_one_get_owner.yml
      - ops/wmm_koneps_whitespace_one_get.py
      - ops/tests/test_wmm_koneps_whitespace_one_get.py
permissions:
  contents: read
jobs:
  offline_review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Synthetic-only tests; no secrets or provider calls
        run: python3 -m unittest discover -s ops/tests -p 'test_wmm_koneps_whitespace_one_get.py' -v
  owner_one_get:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 80 &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == 'leedukyoung74-wq' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/govradar-probe-koneps-whitespace-once'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify synthetic one-GET limit and key redaction first
        run: python3 -m unittest discover -s ops/tests -p 'test_wmm_koneps_whitespace_one_get.py' -v
      - name: Exactly one official goods-list GET; do not print credential
        env:
          KONEPS_KEY: ${{ secrets.KONEPS_KEY }}
        run: python3 ops/wmm_koneps_whitespace_one_get.py
      - name: Explicitly preserve approval and publication boundary
        if: always()
        run: |
          echo "One official GET at most. No collected records published or account updates." >> "$GITHUB_STEP_SUMMARY"
          echo "A 200 response is a schema/transport test for one operation, NOT proof of exhaustive procurement coverage." >> "$GITHUB_STEP_SUMMARY"
