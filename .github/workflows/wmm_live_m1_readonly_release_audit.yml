name: WMM GOV RADAR price and archived-source release QA (GET ONLY)
on:
  pull_request:
    branches: [live]
    paths:
      - 'public/**'
      - '.github/workflows/wmm_live_m1_readonly_release_audit.yml'
  push:
    branches: [live]
    paths:
      - 'public/**'
      - '.github/workflows/wmm_live_m1_readonly_release_audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify_public_copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify static and, after merge, published pages without customer actions
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import os
          import pathlib
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base='https://radar.wmm-hoa.com'
          local=pathlib.Path('public')
          languages={'ko':('20,000','과거 자료만'),'en':('20,000','Archive only'),
                     'es':('20.000','Solo histórico'),'fr':('20 000','Archives uniquement'),
                     'ar':('20,000','أرشيف فقط'),'vi':('20.000','Chỉ dữ liệu cũ'),
                     'id':('20.000','Hanya arsip')}
          expected={}
          for lang,(amount,label) in languages.items():
              expected[f'/{lang}/']=[('HISTORICAL_ONLY','archived-status-guard'),(label,'archive-label')]
              for sub in ('how','member','membership','request'):
                  expected[f'/{lang}/{sub}/']=[('20,000' if sub=='member' else amount,'M1 monthly price')]
          for lang in ('ko','en','ar'):
              expected[f'/{lang}/pricing/']=[('20,000','M1 monthly'),('200,000','M1 annual')]
          expected['/welcome/membership/']=[('20,000','M1 welcome price')]
          expected['/ko/pricing/'].append(('VAT 포함','M1 VAT included'))
          expected['/en/pricing/'].append(('VAT incl.','M1 VAT included'))
          expected['/ar/pricing/'].append(('شامل الضريبة','M1 VAT included'))
          # Four request routes are intentional HTML redirects, not localized forms.
          request_aliases={f'/{lang}/request/':'/en/request/' for lang in ('es','fr','vi','id')}
          for route,target in request_aliases.items():
              expected[route]=[]
          legacy=re.compile(r'(?<![0-9])(?:19[, .]800|198[, .]000)(?![0-9])')
          def check(route, body):
              if route in request_aliases:
                  target=request_aliases[route]
                  # Check the actual meta, canonical, JS and fallback link. The
                  # destination price is checked separately as /en/request/.
                  markers=(
                      f'<meta http-equiv="refresh" content="0;url={target}">',
                      f'<link rel="canonical" href="{base}{target}">',
                      f'location.replace("{target}"+location.search+location.hash)',
                      f'<a href="{target}">'
                  )
                  return ['request_alias_target_missing'] if not all(x in body for x in markers) else []
              problems=[label+'_missing' for value,label in expected[route] if value not in body]
              if route not in [f'/{lang}/' for lang in languages] and legacy.search(body):
                  problems.append('superseded_M1_price_present')
              return problems
          # Synthetic sentinels keep this exception narrow and fail closed.
          for route,target in request_aliases.items():
              fixture=(f'<meta http-equiv="refresh" content="0;url={target}">'
                       f'<link rel="canonical" href="{base}{target}">'
                       f'<script>location.replace("{target}"+location.search+location.hash)</script>'
                       f'<a href="{target}">English</a>')
              assert not check(route,fixture)
              assert check(route,fixture.replace(target,'/ko/request/'))
              assert check(route,'20,000')
          assert not check('/ar/pricing/','20,000 200,000 شامل الضريبة')
          assert check('/ar/pricing/','20,000 200,000 VAT incl.')
          assert check('/en/request/','19,800')
          def relpath(route):
              return local/route.lstrip('/')/'index.html'
          source_errors=[]
          for route in expected:
              path=relpath(route)
              try: html=path.read_text('utf-8')
              except (FileNotFoundError,UnicodeError) as e:
                  source_errors.append((route,type(e).__name__))
                  continue
              source_errors.extend((route,error) for error in check(route,html))
          print('SOURCE',len(expected),'routes','errors',source_errors,flush=True)
          if source_errors:sys.exit(1)
          if os.environ.get('GITHUB_EVENT_NAME')=='pull_request':
              print('REVIEW PASS: static only, no production or customer requests',flush=True)
              sys.exit(0)
          def get(route):
              url=base+route+'?stay=1'
              req=urllib.request.Request(url,headers={'User-Agent':'WMM-live-copy-GET-only/1.0','Accept':'text/html'})
              try:
                  with urllib.request.urlopen(req,timeout=23) as response:
                      actual=response.geturl()
                      if urllib.parse.urlsplit(actual).hostname!='radar.wmm-hoa.com':
                          return route,['unexpected_redirect_host']
                      if response.status!=200:return route,['http_'+str(response.status)]
                      body=response.read(600_001)
                      if len(body)>600_000:return route,['body_too_large']
                      actual_path=urllib.parse.urlsplit(actual).path
                      # HTTP redirect to the exact approved destination is also
                      # acceptable, but must validate the actual English page.
                      if route in request_aliases and actual_path==request_aliases[route]:
                          return route,check(actual_path,body.decode('utf-8','replace'))
                      if actual_path!=route:return route,['unexpected_redirect_path']
                      return route,check(route,body.decode('utf-8','replace'))
              except Exception as err:
                  return route,[type(err).__name__]
          failed=set(expected)
          for attempt in range(4):
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
                  found=dict(pool.map(get,sorted(failed)))
              failed={route for route,problems in found.items() if problems}
              print('PRODUCTION_GET',attempt+1,'pass',len(expected)-len(failed),'of',len(expected),
                    'remaining',[(r,found[r]) for r in sorted(failed)],flush=True)
              if not failed:break
              if attempt<3:time.sleep(18)
          if failed:
              print('FAIL: published site is not yet verified; static branch change alone is insufficient')
              sys.exit(1)
          print('PASS: 39 GET-only routes checked, including four English-request aliases; no claim of localized request forms.')
          print('Not verified: checkout, taxes on invoices, customer form POST, account login or payment.')
          PY
      - name: Retain explicit scope and cost boundary
        if: always()
        run: |
          echo 'Read-only public HTML GET check. No secrets, customer forms, payment, D1 writes, API keys or publishing action.' >> "$GITHUB_STEP_SUMMARY"
