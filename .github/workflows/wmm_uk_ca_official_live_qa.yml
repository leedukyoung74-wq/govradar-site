name: WMM official UK weather + ECCC Toronto Atom pilot (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'tools/official_uk_ca_feeds.py'
      - 'tests/test_official_uk_ca_feeds.py'
      - '.github/workflows/wmm_uk_ca_official_live_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify_official_feeds:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject unsafe feeds and expired event labels
        run: python -m unittest discover -s tests -p 'test_official_uk_ca_feeds.py' -v
      - name: Read only official UK and Canada public publisher feeds
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/wmm-uk-ca-readonly"
          python tools/official_uk_ca_feeds.py --out "$RUNNER_TEMP/wmm-uk-ca-readonly/source.json"
          SOURCE="$RUNNER_TEMP/wmm-uk-ca-readonly/source.json" python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads(Path(os.environ["SOURCE"]).read_text())
          assert j["public_publish_allowed"] is False
          assert j["customer_data_processed"] is False
          assert j["cyberattack_confirmed"] is False
          assert all(x["status"]=="OK" for x in j["health"].values())
          assert j["feeds"]["uk"]["geo_scope"]=="GB"
          assert j["feeds"]["ca"]["geo_scope"]=="CA-ON-TORONTO"
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as o:
              o.write("UK Met Office nationwide RSS and Canada ECCC **Toronto ONLY** Atom official read-only sample:\n\n")
              for k in ["uk","ca"]:
                  o.write(f"- {k}: {j['feeds'][k]['count']} recent headlines; verified feed GET at {j['health'][k]['last_success_at']}. Not confirmed current active warnings.\n")
          PY
      - name: Discard transient source responses
        if: always()
        run: rm -rf "$RUNNER_TEMP/wmm-uk-ca-readonly"
