name: WMM GOV RADAR hourly watcher syntax QA (NO DEPLOY)
on:
  pull_request:
    paths:
      - '.github/workflows/wmm_operations_watch.yml'
      - '.github/workflows/wmm_operations_watch_review.yml'
      - 'ops/wmm_public_source_truth_report.py'
      - 'ops/tests/test_wmm_public_source_truth_report.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile the existing inline Python and confirm strict feed checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          source = Path('.github/workflows/wmm_operations_watch.yml').read_text(encoding='utf8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          assert start in source and end in source, 'watcher Python heredoc not found'
          segment = source.split(start, 1)[1].split(end, 1)[0]
          code = "\n".join(line[10:] if line.startswith('          ') else line for line in segment.splitlines())
          ast.parse(code, filename='wmm_operations_watch.py')
          required = [
              'Official-source tender cache', 'Country-summary listed tender estimate', 'Contract awards',
              'Country-summary listed vs cached tender upper bound', 'max_bytes=2_500_000',
              '30*60', 'sys.exit(1 if failed else 0)',
              # The 879 country brief entries must remain distinct from
              # verified public open tenders and cannot trigger client alerts.
              'Country brief provenance (', 'wmm-radar.pages.dev',
              'verification_grades', 'search_only_not_individually_confirmed',
              'publisher_rerecheck_grade_count', 'stale_labeled_cached_records',
              'only_reviewed_official_hosts', 'not_a_live_confirmed_tender_count',
              'official_notice_verified', 'may_send_business_alert',
              'automated_customer_alerts_allowed', 'seven_language_widget_guard',
              'M1 published payment backend KRW/VAT price parity',
              'checkout_enabled', 'live_payment_and_entitlement_verified',
              'Anonymous form relay GET refused (POST-only)',
              'Anonymous member request GET denied',
              'Anonymous member secret GET denied',
              'NoAnonymousRedirect', 'no_credentials_or_customer_post',
              # Best-effort GitHub cron gaps must not mask official feed
              # staleness, or turn a verified failed workflow into a PASS.
              'SCHEDULE_GAP_UNVERIFIED', 'SCHEDULE_JOB_FAILED',
              'source_freshness_checked_separately', 'pending=True',
              'USGS official fast', 'US NWS weather', 'CISA KEV',
          ]
          for marker in required:
              assert marker in code, 'missing strict health marker: ' + marker
          print('PASS: watcher inline Python compiles; GOV RADAR freshness checks are present; no deployment')
          PY
      - name: Verify manual-snapshot/official-source classification offline (NO DEPLOY)
        run: python3 -m unittest discover -s ops/tests -p 'test_wmm_public_source_truth_report.py' -v
