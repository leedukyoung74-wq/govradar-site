name: Collector tests (offline)
on:
  pull_request:
  push:
    branches: ["review/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Generate static preview required by generated-page tests (NO DEPLOY)
        run: |
          python3 build.py --base https://radar.wmm-hoa.com
          python3 tools/cf_variant.py dist cf/public
      - name: Run offline unit suite against generated preview
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify VAT-inclusive server pricing and GET-only form sentinel (OFFLINE)
        run: node --experimental-default-type=module --test tests/test_billing_form_route_offline.mjs
