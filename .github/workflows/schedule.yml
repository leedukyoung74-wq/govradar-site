# Timer-only workflow on the DEFAULT branch (main). Approved by the owner 2026-11-16.
# Why: GitHub runs `schedule` triggers only from workflow files on the default branch. main has no workflows, so the daily
# cron in src/.github/workflows/tenders.yml has never fired (every run so far was a push event).
# Safety: this file only holds timers. All collection logic lives in src/.github/workflows/feeds.yml and src code,
# so main never needs code changes again. Order: merge PR #1 into src first (feeds.yml must exist on src), then add this file.
# Secrets are passed explicitly (only the two optional API keys); without them the free sources still run.
name: Scheduled feeds
on:
  schedule:
    - cron: "10 21 * * *"   # every day 06:10 KST
    - cron: "40 22 * * 0"   # Monday 07:40 KST
  workflow_dispatch:
    inputs:
      task:    { type: choice, options: [daily, sources], default: daily }
      dry_run: { type: boolean, default: true }
permissions:
  contents: write
jobs:
  preflight_daily:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '10 21 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.task == 'daily')
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    outputs:
      due: ${{ steps.status.outputs.due }}
    steps:
      - name: Read trusted approved main gate
        uses: actions/checkout@v4
        with:
          ref: main
          path: control
          persist-credentials: false
      - name: Read published public feed dates (no credentials)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data_branch
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /feeds/tenders.json
            /feeds/today.json
      - name: Check date and dedup policy offline
        run: python3 -m unittest discover -s control/ops/tests -p 'test_wmm_daily_gap_due.py' -v
      - name: Official scheduled attempt only if today's KST feed is missing
        if: github.event_name == 'schedule'
        id: scheduled
        run: python3 control/ops/wmm_daily_gap_due.py --mode scheduled --data data_branch
      - name: Preserve existing owner-selected manual dry-run behavior
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: echo 'due=true' >> "$GITHUB_OUTPUT"
      - name: Bind single due output
        id: status
        env:
          SCHEDULED: ${{ steps.scheduled.outputs.due }}
          MANUAL: ${{ steps.manual.outputs.due }}
        run: |
          if [ "$SCHEDULED" = "true" ] || [ "$MANUAL" = "true" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi
  daily:
    needs: preflight_daily
    if: >-
      needs.preflight_daily.result == 'success' &&
      needs.preflight_daily.outputs.due == 'true' &&
      ((github.event_name == 'schedule' && github.event.schedule == '10 21 * * *') ||
       (github.event_name == 'workflow_dispatch' && inputs.task == 'daily'))
    uses: leedukyoung74-wq/govradar-site/.github/workflows/feeds.yml@src
    with: { task: daily, code_ref: src, dry_run: "${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}" }
    secrets: { DAPA_KEY: "${{ secrets.DAPA_KEY }}", SAM_KEY: "${{ secrets.SAM_KEY }}" }
  sources:
    if: github.event_name == 'schedule' && github.event.schedule == '40 22 * * 0' || github.event_name == 'workflow_dispatch' && inputs.task == 'sources'
    uses: leedukyoung74-wq/govradar-site/.github/workflows/feeds.yml@src
    with: { task: sources, code_ref: src, dry_run: "${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}" }
