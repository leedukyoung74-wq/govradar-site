*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"NexonLv1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit}button,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.bar{border-bottom:1px solid var(--line);position:fixed;inset:0 0 auto;z-index:30;display:flex;align-items:center;gap:16px;height:68px;padding-top:env(safe-area-inset-top,0px);padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;letter-spacing:.04em;font-size:17px;white-space:nowrap}
.brand img{width:30px;height:30px;border-radius:50%}
.search{position:relative;flex:0 1 320px}
.search input{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:999px;color:var(--ink);padding:9px 16px;font:inherit;font-size:15px}

.sugg button{display:block;width:100%;text-align:start;background:none;border:0;padding:10px 16px;cursor:pointer;font-size:15px}
.sugg button:hover,.sugg button.on{background:var(--bg3)}
.sp{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}

.nav a{text-decoration:none;color:var(--ink2)}.nav a:hover{color:var(--ink)}
.lang{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:14px}

#map path.c{vector-effect:non-scaling-stroke;stroke:#FFFFFF;stroke-width:.6;cursor:pointer;transition:fill .25s}
#map path.c:hover{stroke:var(--ink);stroke-width:1}
#map path.c.sel{stroke:var(--ink);stroke-width:1.6}

.legend{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--ink2);pointer-events:none}
[dir=rtl] .legend{left:auto;right:max(24px,env(safe-area-inset-right,0px))}
.legend .sw{display:flex;gap:2px;margin-top:6px}.legend .sw i{display:block;width:34px;height:8px}
.legend .ends{display:flex;justify-content:space-between;margin-top:4px;color:var(--ink3)}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));font-size:15px;color:var(--ink2);pointer-events:none;transition:opacity .4s;text-align:center}
.hint b{color:var(--ink);font-weight:700}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:14px;padding:6px 10px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-130%);font-weight:700;z-index:4}
.tip small{font-weight:400;margin-inline-start:6px}
.drawer{position:absolute;top:68px;right:0;bottom:0;width:min(520px,100%);background:var(--bg2);overflow-y:auto;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:-18px 0 50px rgba(11,21,38,.12);border-inline-start:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.drawer.open{transform:none}
.drawer:not(.open){box-shadow:none;visibility:hidden;transition:transform .35s,visibility 0s .35s}

.dh .x{position:absolute;right:20px;top:20px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;font-size:20px;line-height:1}
[dir=rtl] .dh .x{right:auto;left:20px}
.dh .flag{font-size:40px;line-height:1}
.dh h1{margin:10px 0 2px;font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.dh .sub{color:var(--ink2);font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:0 32px}
.kpis div{background:var(--bg3);padding:14px 16px}.kpis b{display:block;font-size:26px;line-height:1.1;letter-spacing:-.02em}.kpis span{font-size:13px;color:var(--ink2)}
.sec{padding:26px 32px 4px}.sec h2{margin:0 0 12px;font-size:19px;font-weight:700}.sec p{margin:0 0 10px}
.sec ul{margin:0;padding:0;list-style:none}.sec li{padding:11px 0;border-top:1px solid var(--line);font-size:15.5px}.sec li:first-child{border-top:0;padding-top:0}
.sec li .m{display:block;color:var(--ink2);font-size:14px;margin-top:2px}
.dl{display:inline-block;min-width:74px;font-weight:700;color:var(--gold)}.dl.past{color:var(--ink3);font-weight:400}
.risk-hot{color:var(--hot);font-weight:700}
.full{display:block;margin:28px 32px 12px;padding:16px 20px;text-align:center;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;border-radius:999px}
.full2{display:block;margin:0 32px 36px;padding:14px 20px;text-align:center;border:1px solid var(--line);text-decoration:none;border-radius:999px;color:var(--ink2);font-size:15px}
.muted{color:var(--ink3);font-size:14px}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.sheet{position:fixed;top:60px;right:12px;left:12px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:8px;z-index:40;box-shadow:0 20px 50px rgba(11,21,38,.14)}
.sheet a{display:block;padding:12px 14px;text-decoration:none;border-radius:8px}.sheet a:hover{background:var(--bg3)}
.sheet select{margin:8px 14px 10px}

@media (max-width:640px){

  if(b.bz&&b.bz.length)h+='<div class="sec"><h2>'+esc(t("biz"))+'</h2>'+li(b.bz,function(x){return"<li>"+addBtn(i,"b",x)+esc(x)+"</li>"})+'</div>';
  if(b.ag&&b.ag.length)h+='<div class="sec"><h2>'+esc(t("agenda"))+'</h2>'+li(b.ag,function(x){return"<li>"+esc(x)+"</li>"})+'</div>';
  if(b.nd&&b.nd.length)h+='<div class="sec"><h2>'+esc(t("needs"))+'</h2>'+li(b.nd,function(x){return"<li>"+esc(x)+"</li>"})+'</div>';
  if(b.pj&&b.pj.length)h+='<div class="sec"><h2>'+esc(t("proj"))+'</h2>'+li(b.pj,function(x){return"<li>"+addBtn(i,"p",x.t)+esc(x.t)+'<span class="m">'+esc([x.m,x.g].filter(Boolean).join(" · "))+"</span></li>"})+'</div>';
  var rk=(c.hz?'<span class="risk-hot">'+esc(t(c.hz))+'</span> · ':"")+esc(t("rl")[c.rk]||"");
  if(rk||(b.rc&&b.rc.length))h+='<div class="sec"><h2>'+esc(t("risk"))+'</h2>'+(rk?'<p>'+rk+'</p>':"")+li(b.rc,function(x){return"<li>"+esc(x)+"</li>"})+'</div>';
  if(c.sr&&c.sr.length)h+='<div class="sec"><h2>'+esc(t("src"))+'</h2>'+li(c.sr,function(x){return'<li><a href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.t)+"</a></li>"})+'</div>';
  if(c.sl)h+='<a class="full" href="/'+L+'/'+esc(c.sl)+'/?stay=1">'+esc(t("full"))+' →</a>';
  h+='<a class="full2" href="/'+L+'/pricing/?stay=1">'+esc(t("join"))+'</a>';
  dr.innerHTML=h;dr.classList.add("open");if(!keep){dr.scrollTop=0;zoomTo(i)}
  document.getElementById("dx").onclick=closeCountry;
  dr.querySelectorAll("[data-add]").forEach(function(btn){btn.onclick=function(){var id=btn.dataset.add,k=id.split(":")[1];bkToggle({id:id,iso:i,k:k,t:btn.dataset.t||"",d:btn.dataset.d||"",u:btn.dataset.u||""});showCountry(i,true)}});
  try{history.replaceState(null,"","#"+i.toLowerCase())}catch(e){}
}
function closeCountry(){sel=null;document.getElementById("drawer").classList.remove("open");paint();if(svg)svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity);try{history.replaceState(null,"",location.pathname)}catch(e){}}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeCountry()});
var q=document.getElementById("q"),sg=document.getElementById("sugg"),hits=[],hi=0;
q.oninput=function(){var v=q.value.trim().toLowerCase();if(!v){sg.hidden=true;return}
  hits=Object.keys(D).filter(function(k){var n=D[k].n;return Object.keys(n).some(function(l){return String(n[l]||"").toLowerCase().indexOf(v)>=0})||k.toLowerCase()===v}).slice(0,7);hi=0;draw()};
function draw(){if(!hits.length){sg.hidden=true;return}sg.hidden=false;sg.innerHTML=hits.map(function(k,j){return'<button class="'+(j===hi?"on":"")+'" data-k="'+k+'">'+flag(k)+" "+esc(nm(k))+"</button>"}).join("");
  sg.querySelectorAll("button").forEach(function(b){b.onmousedown=function(e){e.preventDefault();pick(b.dataset.k)}})}
function pick(k){sg.hidden=true;q.value="";q.blur();showCountry(k)}
q.onkeydown=function(e){if(sg.hidden)return;if(e.key==="ArrowDown"){hi=Math.min(hits.length-1,hi+1);draw();e.preventDefault()}else if(e.key==="ArrowUp"){hi=Math.max(0,hi-1);draw();e.preventDefault()}else if(e.key==="Enter"&&hits[hi])pick(hits[hi])};
q.onblur=function(){setTimeout(function(){sg.hidden=true},120)};
})();
</script>
</body>
</html>
