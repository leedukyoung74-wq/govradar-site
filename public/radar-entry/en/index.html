<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create a GOV RADAR account or sign in">
  <title>Get started with GOV RADAR · WMM</title>
  <link rel="icon" href="/wmm-logo.png">
  <link rel="stylesheet" href="/radar-entry/entry.css">
  <script src="/radar-entry/motion.js" defer></script>
</head>
<body>
  <header>
    <a href="/?lang=en#gov-radar">← WMM homepage</a>
    <a href="/radar-entry/" lang="ko" hreflang="ko">한국어</a>
  </header>
  <main>
    <div class="radar-media">
      <video data-radar-motion muted loop playsinline preload="none" poster="/radar-entry/poster.jpg" aria-hidden="true"></video>
      <button type="button" data-radar-toggle hidden>
        <span data-radar-play>Play animation</span>
        <span data-radar-pause hidden>Pause animation</span>
      </button>
    </div>
    <div class="radar-copy">
      <h1>GOV RADAR</h1>
      <p>Find government notices, tenders, public projects and situation reports by country. New to GOV RADAR? Create a free account to get started.</p>
      <a class="radar-continue" href="https://radar.wmm-hoa.com/welcome/en/login/">Sign up or log in <span aria-hidden="true">→</span></a>
    </div>
  </main>
</body>
</html>
