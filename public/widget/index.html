<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOV RADAR widget</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css"><style>
body{margin:0;font-family:"NEXON Lv1 Gothic OTF","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:#0a0a0a;color:#f2f2ef}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #2b2b2a}header img{height:30px}header a{margin-left:auto;color:#f2f2ef;font-size:12px}
ul{list-style:none;margin:0;padding:6px 0}li a{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;color:#f2f2ef;text-decoration:none;border-bottom:1px solid #1d1d1c}li a:hover{background:#151515}
.fi{width:1.4em;line-height:1em;margin-top:3px;flex:none}small{display:block;color:#9a9a96;font-size:12px}b.t{font-size:14px}#source-disclaimer{margin:12px 14px;font-size:12px;line-height:1.6;color:#edcf95}
</style></head><body><header><img src="/assets/logo-h.webp" alt="GOV RADAR" style="width:auto;height:30px;filter:none"><a id="more" href="/" target="_blank" rel="noopener">→</a></header><p id="source-disclaimer" role="note"></p><ul id="l"></ul>
<script>
const p=new URLSearchParams(location.search),L=p.get("lang")||"ko",ind=p.get("industry"),iso=(p.get("iso")||"").toUpperCase();
document.getElementById("more").href="/"+L+"/";
const warnings={ko:"국가별 조사 후보 · 공식 공고 원문·접수 마감일 미확인",en:"Country research candidates — official notices and application deadlines unverified",es:"Candidatos de investigación: avisos y plazos oficiales sin verificar",fr:"Pistes de recherche : avis et échéances officiels non vérifiés",ar:"مواد بحثية فقط: الإعلانات والمواعيد الرسمية غير مؤكدة",vi:"Đề xuất nghiên cứu: chưa xác minh thông báo và hạn nộp chính thức",id:"Kandidat riset: pengumuman dan tenggat resmi belum diverifikasi"};
document.getElementById("source-disclaimer").textContent=warnings[L]||warnings.en;
fetch("/data/opps.json").then(r=>r.json()).then(o=>{
 if(o.index_kind!=="unverified_country_brief_candidates"||o.verified_official_notice_count!==0||
    o.automated_customer_alerts_allowed!==false||!Array.isArray(o.items)||
    o.items.some(x=>x.official_notice_verified!==false||x.may_send_business_alert!==false)){
    document.getElementById("source-disclaimer").textContent=warnings[L]||warnings.en;
    return; // fail closed: do not render unqualified source as a real tender
 }
 let a=o.items;if(iso)a=a.filter(x=>x.iso===iso);if(ind)a=a.filter(x=>(x.ind||[]).includes(ind));
 const lk=L==="ko"?"ko":"en";document.getElementById("l").innerHTML=a.slice(0,12).map(x=>`<li><a href="/${L}/${x.slug}/#${x.kind}" target="_blank" rel="noopener"><span class="fi fi-${x.iso.toLowerCase()}"></span><span><b class="t"></b><small></small></span></a></li>`).join("");
 [...document.querySelectorAll("#l li")].forEach((li,i)=>{const x=a[i];li.querySelector(".t").textContent=x[lk]||x.en;li.querySelector("small").textContent="⚠ "+(x.names[L]||x.names.en)+(x.official_notice_verified===true&&x.deadline?" · "+x.deadline:"")})});
</script></body></html>
